
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードコレクション</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .season-owned-value {
      margin: 8px 0 4px;
      font-weight: 700;
      line-height: 1.9;
    }
    .season-tab-summary {
      margin: 4px 0 8px;
      font-weight: 700;
      color: #8d6b91;
    }
    .missing-list-link {
      margin: 4px 0 10px;
      font-size: 0.9rem;
    }
    .missing-list-link a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .back-to-top {
      position: fixed;
      right: 18px;
      bottom: 24px;
      z-index: 999;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      background: rgba(65,48,83,0.88);
      color: #fff;
      font-size: 25px;
      line-height: 1;
      box-shadow: 0 3px 12px rgba(40,20,55,0.2);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s, visibility 0.25s;
    }
    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .sale-actions { margin: 14px 0; text-align: right; }
    .sale-add-button, .sale-edit-button, .sale-delete-button {
      border: 1px solid #b79db9; border-radius: 999px; padding: 8px 14px;
      background: #fff8fc; color: #6f5575; cursor: pointer; font: inherit;
    }
    .sale-add-button { font-weight: 700; }
    .sale-panel { margin: 16px 0 28px; }
    .sale-summary { margin: 8px 0 16px; color: #8d6b91; font-weight: 700; }
    .sale-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px;
      margin: 10px 0; border: 1px solid #eaddea; border-radius: 14px; background: #fff; }
    .sale-card-image { width: 76px; flex: 0 0 76px; }
    .sale-card-image img { display: block; width: 100%; height: auto; border-radius: 7px; }
    .sale-card-content { flex: 1; min-width: 0; }
    .sale-card-name { font-weight: 700; overflow-wrap: anywhere; }
    .sale-record { padding: 10px 0; border-top: 1px solid #eee5ee; }
    .sale-record:first-child { border-top: 0; }
    .sale-record-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .sale-delete-button { color: #9b4f65; border-color: #d9aab8; background: #fff8fa; }
    .sale-empty { text-align: center; padding: 24px 10px; color: #8b7c8d; }
    .sale-modal-overlay { position: fixed; inset: 0; z-index: 2000; display: flex;
      align-items: center; justify-content: center; padding: 16px; background: rgba(30,20,35,.55); }
    .sale-modal-box { width: min(100%, 430px); max-height: 90vh; overflow-y: auto;
      padding: 20px; border-radius: 16px; background: #fffafd; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
    .sale-modal-box h3 { margin: 0 0 16px; color: #6f5575; }
    .sale-form-row { margin: 12px 0; }
    .sale-form-row label { display: block; margin-bottom: 5px; font-weight: 700; }
    .sale-form-row input, .sale-form-row select { box-sizing: border-box; width: 100%; min-height: 42px;
      padding: 8px 10px; border: 1px solid #d9cbdc; border-radius: 8px; background: white; font: inherit; }
    .sale-modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .sale-save-button { border: 0; border-radius: 999px; padding: 9px 18px; background: #8d6b91; color: white; font: inherit; cursor: pointer; }
    .sale-cancel-button { border: 1px solid #cdbdce; border-radius: 999px; padding: 9px 18px; background: white; color: #6f5575; font: inherit; cursor: pointer; }
    .sale-note { margin: 8px 0; font-size: .82rem; color: #887b89; }
    .status-button[data-status="sold"] { white-space: nowrap; }
  </style>
</head>
<body>
  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ CARD COLLECTION ♡</p>
  </header>

  <main class="cards-page">
    <a href="index.html" class="back-link">‹ Collection</a>

    <section class="season-header">
      <h2 id="seasonTitle">第1弾</h2>
      <p id="collectionStatus">0 / 85</p>

      <p class="season-owned-value" id="seasonOwnedValue">
        所持枚数：0枚<br>
        合計獲得枚数：0枚<br>
        使用金額：0円
      </p>

      <p class="season-tab-summary" id="seasonTabSummary" aria-live="polite"></p>

      <p class="missing-list-link">
        <a id="missingListLink" href="missing-cards.html?season=1">未所持カードを一覧で見る ♡</a>
      </p>

      <div class="collection-progress" aria-label="コレクション進捗">
        <div class="collection-progress-bar" id="collectionProgressBar"></div>
      </div>
      <p class="collection-progress-text" id="collectionProgressText">0%</p>
    </section>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="カード番号・カード名を検索">
    </div>

    <div class="status-filters">
      <button class="status-button active" data-status="all">すべて</button>
      <button class="status-button" data-status="owned">所持</button>
      <button class="status-button" data-status="missing">未所持</button>
      <button class="status-button" data-status="trade">交換</button>
      <button class="status-button" data-status="sold">売却済み</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label for="typeFilter">タイプ</label>
        <select id="typeFilter"><option value="">すべて</option></select>
      </div>
      <div class="filter-group">
        <label for="brandFilter">ブランド</label>
        <select id="brandFilter"><option value="">すべて</option></select>
      </div>
      <div class="filter-group">
        <label for="coordinateFilter">コーデ</label>
        <select id="coordinateFilter"><option value="">すべて</option></select>
      </div>
      <div class="filter-group">
        <label for="categoryFilter">カテゴリ</label>
        <select id="categoryFilter"><option value="">すべて</option></select>
      </div>
      <div class="filter-group">
        <label for="parallelFilter">カード種類</label>
        <select id="parallelFilter">
          <option value="">すべて</option>
          <option value="normal">通常カード</option>
          <option value="parallel">パラレル</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="rarityFilter">レアリティ</label>
        <select id="rarityFilter"><option value="">すべて</option></select>
      </div>
    </div>

    <div id="loading" class="loading">カードを読み込み中…</div>
    <div id="cardGrid" class="card-grid"></div>

    <section id="salePanel" class="sale-panel" hidden>
      <div class="sale-actions">
        <button type="button" id="addSaleButton" class="sale-add-button">＋ 売却済カードを追加</button>
      </div>
      <p id="saleSummary" class="sale-summary"></p>
      <div id="saleList"></div>
    </section>
  </main>

  <button type="button" id="backToTop" class="back-to-top"
    aria-label="ページの一番上へ" title="一番上へ">↑</button>

  <footer><p>♡ AIKATSU ENCORE ♡</p></footer>

  <script>
    const params = new URLSearchParams(location.search);
    const season = params.get("season") || "1";
    const storageKey = `aikatsu-encore-season-${season}`;
    const purchaseStorageKey = `aikatsu-encore-purchases-${season}`;
    const salesStorageKey = `aikatsu-encore-sales-${season}`;

    let cards = [];
    let ownership = {};
    let purchaseCounts = {};
    let sales = [];
    let currentStatus = "all";

    const seasonTitle = document.getElementById("seasonTitle");
    const collectionStatus = document.getElementById("collectionStatus");
    const collectionProgressBar = document.getElementById("collectionProgressBar");
    const collectionProgressText = document.getElementById("collectionProgressText");
    const searchInput = document.getElementById("searchInput");
    const cardGrid = document.getElementById("cardGrid");
    const loading = document.getElementById("loading");
    const typeFilter = document.getElementById("typeFilter");
    const brandFilter = document.getElementById("brandFilter");
    const coordinateFilter = document.getElementById("coordinateFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const parallelFilter = document.getElementById("parallelFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    const backToTop = document.getElementById("backToTop");

    try {
      const savedOwnership = localStorage.getItem(storageKey);
      ownership = savedOwnership ? JSON.parse(savedOwnership) : {};
      if (!ownership || typeof ownership !== "object" || Array.isArray(ownership)) {
        ownership = {};
      }
    } catch (error) {
      console.error("所持数データを読み込めませんでした", error);
      ownership = {};
    }

    try {
      const savedPurchases = localStorage.getItem(purchaseStorageKey);
      purchaseCounts = savedPurchases ? JSON.parse(savedPurchases) : { ...ownership };
      if (!purchaseCounts || typeof purchaseCounts !== "object" || Array.isArray(purchaseCounts)) {
        purchaseCounts = { ...ownership };
      }
      if (!savedPurchases) {
        localStorage.setItem(purchaseStorageKey, JSON.stringify(purchaseCounts));
      }
    } catch (error) {
      console.error("購入枚数データを読み込めませんでした", error);
      purchaseCounts = { ...ownership };
    }

    try {
      const savedSales = localStorage.getItem(salesStorageKey);
      sales = savedSales ? JSON.parse(savedSales) : [];
      if (!Array.isArray(sales)) sales = [];
    } catch (error) {
      console.error("売却履歴を読み込めませんでした", error);
      sales = [];
    }

    function saveOwnership() {
      localStorage.setItem(storageKey, JSON.stringify(ownership));
    }

    function savePurchaseCounts() {
      localStorage.setItem(purchaseStorageKey, JSON.stringify(purchaseCounts));
    }

    function saveSales() {
      localStorage.setItem(salesStorageKey, JSON.stringify(sales));
    }

    fetch("cards.json")
      .then(response => {
        if (!response.ok) throw new Error("cards.jsonを読み込めませんでした");
        return response.json();
      })
      .then(data => {
        const allCards = Array.isArray(data) ? data : data.cards || [];
        cards = allCards.filter(card =>
          (!card.collection ||
            String(card.collection).toLowerCase() !== "promotion") &&
          String(card.season || "") === String(season)
        );

        seasonTitle.textContent = `第${season}弾`;

        document.getElementById("missingListLink").href =
          `missing-cards.html?season=${encodeURIComponent(season)}`;

        setupFilters();
        updateStatus();
        renderCards();
        loading.style.display = "none";
      })
      .catch(error => {
        console.error(error);
        loading.textContent = "カードを読み込めませんでした。cards.jsonの場所を確認してね。";
      });

    function getRarity(card) {
      const normalize = value => {
        const raw = String(value || "").trim().toUpperCase();
        const aliases = {
          "ノーマル": "N",
          "NORMAL": "N",
          "レア": "R",
          "RARE": "R",
          "プレミアムレア": "PR",
          "PREMIUM RARE": "PR",
          "スーパープレミアムレア": "SPR",
          "キャンペーンレア": "CP",
          "エンジェリーレア": "ER"
        };
        return aliases[raw] || raw;
      };

      if (card.rarity !== undefined && card.rarity !== null &&
          String(card.rarity).trim() !== "") {
        return normalize(card.rarity);
      }

      const id = String(card.id || "").trim().replace(/_(?:PARALLEL|PARA|P)$/i, "");
      const match = id.match(/_(SPR|PR|CP|ER|R|N)$/i);
      return match ? match[1].toUpperCase() : "";
    }

    function isParallelCard(card) {
      return card.parallel === true ||
        /(?:_PARALLEL|_PARA|_P)$/i.test(String(card.id || ""));
    }

    function setupFilters() {
      fillFilter(typeFilter, "type");
      fillFilter(brandFilter, "brand");
      fillFilter(coordinateFilter, "coordinate");

      const rarityOrder = ["PR", "SPR", "CP", "R", "N"];
      const rarities = [...new Set(cards.map(getRarity).filter(Boolean))];

      rarities.sort((a, b) => {
        const ai = rarityOrder.indexOf(a);
        const bi = rarityOrder.indexOf(b);
        if (ai === -1 && bi === -1) return a.localeCompare(b, "ja");
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });

      rarities.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        rarityFilter.appendChild(option);
      });

      const categoryOrder = [
        "トップス", "ボトムス", "シューズ", "アクセサリー",
        "トップス＆ボトムス", "フルコーデ"
      ];

      const normalizeCategory = value => value.replace(/＆/g, "&");

      const categories = [...new Set(
        cards.map(card => String(card.category || "").trim()).filter(Boolean)
      )];

      categories.sort((a, b) => {
        const ai = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(a)
        );
        const bi = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(b)
        );
        if (ai === -1 && bi === -1) return a.localeCompare(b, "ja");
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });

      categories.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value.replace(
          "トップス&ボトムス", "トップス＆ボトムス"
        );
        categoryFilter.appendChild(option);
      });
    }

    function fillFilter(select, key) {
      const values = [...new Set(
        cards.map(card => card[key])
          .filter(value => value !== undefined && value !== null &&
            String(value).trim() !== "")
          .map(value => String(value).trim())
      )].sort((a, b) => a.localeCompare(b, "ja"));

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function getCount(card) {
      return Math.max(0, Number(ownership[card.id]) || 0);
    }

    function setCount(card, count) {
      const oldCount = getCount(card);
      const nextCount = Math.max(0, Number(count) || 0);

      if (nextCount <= 0) delete ownership[card.id];
      else ownership[card.id] = nextCount;

      const purchaseNext = Math.max(
        0,
        (Number(purchaseCounts[card.id]) || 0) + nextCount - oldCount
      );

      if (purchaseNext <= 0) delete purchaseCounts[card.id];
      else purchaseCounts[card.id] = purchaseNext;

      try {
        saveOwnership();
        savePurchaseCounts();
      } catch (error) {
        console.error("所持数を保存できませんでした", error);
        alert("所持数を保存できなかったよ。ブラウザの保存設定を確認してね。");
        return;
      }

      updateStatus();
      renderCards();
    }

    function updateStatus() {
      const total = cards.length;
      const owned = cards.filter(card => getCount(card) >= 1).length;

      const totalCopies = cards.reduce(
        (sum, card) => sum + getCount(card), 0
      );

      const totalPurchased = cards.reduce(
        (sum, card) =>
          sum + Math.max(0, Number(purchaseCounts[card.id]) || 0),
        0
      );

      const totalCost = totalPurchased * 100;

      document.getElementById("seasonOwnedValue").innerHTML =
        `所持枚数：${totalCopies.toLocaleString("ja-JP")}枚<br>` +
        `合計獲得枚数：${totalPurchased.toLocaleString("ja-JP")}枚<br>` +
        `使用金額：${totalCost.toLocaleString("ja-JP")}円`;

      const missingTypes = cards.filter(card => getCount(card) < 1).length;

      const tradeCopies = cards.reduce(
        (sum, card) => sum + Math.max(0, getCount(card) - 1), 0
      );

      const tabSummary = document.getElementById("seasonTabSummary");

      if (currentStatus === "missing") {
        tabSummary.textContent = `未所持 ${missingTypes}種類`;
        tabSummary.style.display = "block";
      } else if (currentStatus === "trade") {
        tabSummary.textContent = `交換可能 ${tradeCopies}枚`;
        tabSummary.style.display = "block";
      } else if (currentStatus === "sold") {
        const soldProfit = sales.reduce(
          (sum, item) => sum + (Number(item.profit) || 0), 0
        );
        tabSummary.textContent =
          `売却 ${sales.length}件　利益合計 ${soldProfit.toLocaleString("ja-JP")}円`;
        tabSummary.style.display = "block";
      } else {
        tabSummary.textContent = "";
        tabSummary.style.display = "none";
      }

      collectionStatus.textContent = `${owned} / ${total}`;

      const percentage = total > 0 ? Math.round((owned / total) * 100) : 0;

      collectionProgressText.textContent = `${percentage}%`;
      collectionProgressBar.style.width = `${percentage}%`;
    }

    function getFilteredCards() {
      const keyword = searchInput.value.toLowerCase().trim();
      const type = typeFilter.value;
      const brand = brandFilter.value;
      const coordinate = coordinateFilter.value;
      const category = categoryFilter.value;
      const parallel = parallelFilter.value;
      const rarity = rarityFilter.value;

      return cards.filter(card => {
        const searchableText = [card.id, card.name, card.unit]
          .filter(Boolean).join(" ").toLowerCase();

        const count = getCount(card);

        if (keyword && !searchableText.includes(keyword)) return false;
        if (type && String(card.type || "").trim() !== type) return false;
        if (brand && String(card.brand || "").trim() !== brand) return false;
        if (coordinate && String(card.coordinate || "").trim() !== coordinate) return false;

        const cardCategory = String(card.category || "").trim()
          .replace("トップス&ボトムス", "トップス＆ボトムス");

        if (category && cardCategory !== category) return false;
        if (rarity && getRarity(card) !== rarity) return false;

        const parallelCard = isParallelCard(card);

        if (parallel === "parallel" && !parallelCard) return false;
        if (parallel === "normal" && parallelCard) return false;

        if (currentStatus === "owned" && count < 1) return false;
        if (currentStatus === "missing" && count >= 1) return false;
        if (currentStatus === "trade" && count < 2) return false;

        return true;
      });
    }

    /* カード一覧と売却履歴を表示 */
    function renderCards() {
      cardGrid.innerHTML = "";

      const salePanel = document.getElementById("salePanel");

      if (currentStatus === "sold") {
        cardGrid.style.display = "none";
        salePanel.hidden = false;
        renderSales();
        return;
      }

      cardGrid.style.display = "";

      // 「すべて」のときだけ、カード一覧の下に売却履歴を表示
      salePanel.hidden = currentStatus !== "all";

      if (currentStatus === "all") {
        renderSales();
      }

      const filtered = getFilteredCards();

      if (filtered.length === 0) {
        cardGrid.innerHTML = '<p class="no-results">該当するカードがありません。</p>';
        return;
      }

      filtered.forEach(card => {
        const count = getCount(card);
        const rarity = getRarity(card);

        const cardElement = document.createElement("article");
        cardElement.className = "card";

        cardElement.innerHTML = `
          <div class="card-image">
            <img src="${escapeHTML(card.image || "")}"
              alt="${escapeHTML(card.name || card.id || "")}"
              onerror="this.style.display='none'">
          </div>
          <div class="card-info">
            <div class="card-id">${escapeHTML(card.id || "")}</div>
            <div class="card-name">${escapeHTML(card.name || "")}</div>
            <div class="card-meta">${escapeHTML(card.brand || "")}</div>
            ${rarity ? `<div class="card-meta">レアリティ：${escapeHTML(rarity)}</div>` : ""}
            ${count >= 2 ? '<div class="trade-label">♡ 交換可能</div>' : ""}
          </div>
          <div class="count-control">
            <button type="button" class="count-button minus" aria-label="所持数を減らす">−</button>
            <span class="count">${count}</span>
            <button type="button" class="count-button plus" aria-label="所持数を増やす">＋</button>
          </div>
        `;

        cardElement.querySelector(".minus").addEventListener("click", event => {
          event.stopPropagation();
          setCount(card, Math.max(0, count - 1));
        });

        cardElement.querySelector(".plus").addEventListener("click", event => {
          event.stopPropagation();
          setCount(card, count + 1);
        });

        cardElement.addEventListener("click", () => openCardModal(card));

        cardGrid.appendChild(cardElement);
      });
    }

    function getCardById(cardId) {
      return cards.find(card => String(card.id) === String(cardId));
    }

    function renderSales() {
      const list = document.getElementById("saleList");
      const summary = document.getElementById("saleSummary");

      const totalPrice = sales.reduce(
        (sum, item) => sum + (Number(item.price) || 0), 0
      );

      const totalProfit = sales.reduce(
        (sum, item) => sum + (Number(item.profit) || 0), 0
      );

      summary.textContent =
        `売却 ${sales.length}件　売却価格合計 ${totalPrice.toLocaleString("ja-JP")}円　実際の利益合計 ${totalProfit.toLocaleString("ja-JP")}円`;

      list.innerHTML = "";

      if (sales.length === 0) {
        list.innerHTML = '<p class="sale-empty">まだ売却履歴がありません。</p>';
        return;
      }

      const grouped = new Map();

      sales.forEach(item => {
        const key = String(item.cardId);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(item);
      });

      [...grouped.entries()].forEach(([cardId, records]) => {
        const card = getCardById(cardId);
        if (!card) return;

        records.sort((a, b) =>
          String(b.date || "").localeCompare(String(a.date || ""))
        );

        const article = document.createElement("article");
        article.className = "sale-card";

        const recordMarkup = records.map(item => `
          <div class="sale-record">
            <div><strong>${escapeHTML(item.date || "日付未設定")}</strong></div>
            <div>売却価格：${(Number(item.price) || 0).toLocaleString("ja-JP")}円</div>
            <div>実際の利益：${(Number(item.profit) || 0).toLocaleString("ja-JP")}円</div>
            <div class="sale-record-actions">
              <button type="button" class="sale-edit-button" data-edit="${escapeHTML(item.id)}">編集</button>
              <button type="button" class="sale-delete-button" data-delete="${escapeHTML(item.id)}">削除</button>
            </div>
          </div>
        `).join("");

        article.innerHTML = `
          <div class="sale-card-image">
            <img src="${escapeHTML(card.image || "")}"
              alt="${escapeHTML(card.name || card.id || "")}"
              onerror="this.style.display='none'">
          </div>
          <div class="sale-card-content">
            <div class="sale-card-name">${escapeHTML(card.id || "")}　${escapeHTML(card.name || "")}</div>
            <div class="sale-note">売却履歴：${records.length}件</div>
            <details><summary>履歴を表示</summary>${recordMarkup}</details>
          </div>
        `;

        article.querySelectorAll("[data-edit]").forEach(button => {
          button.addEventListener("click", () =>
            openSaleModal(button.dataset.edit)
          );
        });

        article.querySelectorAll("[data-delete]").forEach(button => {
          button.addEventListener("click", () =>
            deleteSale(button.dataset.delete)
          );
        });

        list.appendChild(article);
      });
    }

    function openSaleModal(editId = null) {
      const editing = editId !== null;
      const record = editing
        ? sales.find(item => String(item.id) === String(editId))
        : null;

      if (editing && !record) return;

      const modal = document.createElement("div");
      modal.className = "sale-modal-overlay";

      const box = document.createElement("div");
      box.className = "sale-modal-box";

      const options = cards
        .filter(card => editing ? true : getCount(card) > 0)
        .map(card =>
          `<option value="${escapeHTML(card.id)}">${escapeHTML(card.id)}　${escapeHTML(card.name || "")}</option>`
        ).join("");

      const today = new Date();

      const todayText =
        `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

      box.innerHTML = `
        <h3>${editing ? "売却履歴を編集" : "売却履歴を追加"}</h3>
        <form id="saleForm">
          <div class="sale-form-row">
            <label for="saleCard">カード</label>
            <select id="saleCard" required>${options}</select>
          </div>

          <div class="sale-form-row">
            <label for="saleDate">売却日</label>
            <input id="saleDate" type="date"
              value="${escapeHTML(record?.date || todayText)}" required>
          </div>

          <div class="sale-form-row">
            <label for="salePrice">売却価格（円）</label>
            <input id="salePrice" type="number" min="0" step="1"
              value="${editing ? Number(record.price)||0 : ""}" required>
          </div>

          <div class="sale-form-row">
            <label for="saleProfit">実際の利益（円）</label>
            <input id="saleProfit" type="number" min="0" step="1"
              value="${editing ? Number(record.profit)||0 : ""}" required>
          </div>

          <p class="sale-note">
            実際の利益は、手数料・送料などを差し引いて手元に残った金額を入力してね。
          </p>

          <div class="sale-modal-buttons">
            <button type="button" class="sale-cancel-button">キャンセル</button>
            <button type="submit" class="sale-save-button">保存</button>
          </div>
        </form>
      `;

      modal.appendChild(box);
      document.body.appendChild(modal);

      const form = box.querySelector("#saleForm");
      const cardSelect = box.querySelector("#saleCard");

      if (editing) cardSelect.value = String(record.cardId);

      function close() {
        modal.remove();
      }

      box.querySelector(".sale-cancel-button").addEventListener("click", close);

      modal.addEventListener("click", event => {
        if (event.target === modal) close();
      });

      form.addEventListener("submit", event => {
        event.preventDefault();

        const cardId = cardSelect.value;
        const date = box.querySelector("#saleDate").value;
        const price = Number(box.querySelector("#salePrice").value);
        const profit = Number(box.querySelector("#saleProfit").value);

        if (!cardId || !date ||
            !Number.isFinite(price) || price < 0 ||
            !Number.isFinite(profit) || profit < 0) {
          alert("入力内容を確認してね。");
          return;
        }

        if (editing) {
          record.cardId = cardId;
          record.date = date;
          record.price = price;
          record.profit = profit;
        } else {
          const selectedCard = getCardById(cardId);

          if (!selectedCard || getCount(selectedCard) < 1) {
            alert("売却するカードの所持枚数がありません。");
            return;
          }

          sales.push({
            id: `sale-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
            cardId,
            date,
            price,
            profit
          });

          const nextCount = getCount(selectedCard) - 1;

          if (nextCount <= 0) delete ownership[cardId];
          else ownership[cardId] = nextCount;

          try {
            saveOwnership();
          } catch (error) {
            alert("所持枚数を保存できなかったよ。");
            return;
          }
        }

        try {
          saveSales();
        } catch (error) {
          console.error(error);
          alert("売却履歴を保存できなかったよ。ブラウザの保存設定を確認してね。");
          return;
        }

        close();
        updateStatus();
        renderCards();
      });
    }

    function deleteSale(id) {
      const index = sales.findIndex(
        item => String(item.id) === String(id)
      );

      if (index < 0) return;

      if (!confirm("この売却履歴を削除する？ 所持枚数が1枚戻るよ。")) {
        return;
      }

      const removed = sales[index];
      sales.splice(index, 1);

      const card = getCardById(removed.cardId);

      if (card) {
        ownership[card.id] = getCount(card) + 1;
      }

      try {
        saveSales();
        saveOwnership();
      } catch (error) {
        alert("保存できなかったよ。もう一度読み込み直して確認してね。");
        return;
      }

      updateStatus();
      renderCards();
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function openCardModal(card) {
      const modal = document.createElement("div");
      modal.className = "card-modal";

      const content = document.createElement("div");
      content.className = "card-modal-content";

      content.innerHTML = `
        <button type="button" class="card-modal-close" aria-label="閉じる">×</button>
        <div class="modal-card-area">
          <button type="button" class="card-side-arrow left" aria-label="表裏を切り替え">‹</button>
          <img class="modal-card-image" alt="">
          <button type="button" class="card-side-arrow right" aria-label="表裏を切り替え">›</button>
        </div>
        <div class="card-side-buttons">
          <button type="button" class="card-side-button active" data-side="front">表</button>
          <button type="button" class="card-side-button" data-side="back">裏</button>
        </div>
      `;

      modal.appendChild(content);
      document.body.appendChild(modal);

      const image = content.querySelector(".modal-card-image");
      const frontButton = content.querySelector('[data-side="front"]');
      const backButton = content.querySelector('[data-side="back"]');
      const leftArrow = content.querySelector(".card-side-arrow.left");
      const rightArrow = content.querySelector(".card-side-arrow.right");

      let currentSide = "front";

      function showSide(side) {
        if (side === "back" && card.backImage) {
          currentSide = "back";
          image.src = card.backImage;
          image.alt = `${card.name || card.id} 裏面`;
          frontButton.classList.remove("active");
          backButton.classList.add("active");
        } else {
          currentSide = "front";
          image.src = card.image || "";
          image.alt = card.name || card.id || "";
          frontButton.classList.add("active");
          backButton.classList.remove("active");
        }
      }

      showSide("front");

      frontButton.addEventListener("click", event => {
        event.stopPropagation();
        showSide("front");
      });

      backButton.addEventListener("click", event => {
        event.stopPropagation();
        if (card.backImage) showSide("back");
      });

      function toggleSide() {
        if (card.backImage) {
          showSide(currentSide === "back" ? "front" : "back");
        }
      }

      leftArrow.addEventListener("click", event => {
        event.stopPropagation();
        toggleSide();
      });

      rightArrow.addEventListener("click", event => {
        event.stopPropagation();
        toggleSide();
      });

      const cardArea = content.querySelector(".modal-card-area");

      cardArea.addEventListener("click", event => {
        if (event.target.classList.contains("card-side-arrow")) return;

        const rect = cardArea.getBoundingClientRect();
        const tapX = event.clientX - rect.left;

        if (tapX < rect.width / 2) showSide("front");
        else if (card.backImage) showSide("back");
      });

      let touchStartX = 0;

      cardArea.addEventListener("touchstart", event => {
        touchStartX = event.changedTouches[0].screenX;
      }, { passive: true });

      cardArea.addEventListener("touchend", event => {
        const distance =
          event.changedTouches[0].screenX - touchStartX;

        if (Math.abs(distance) < 50 || !card.backImage) return;

        showSide(distance < 0 ? "back" : "front");
      }, { passive: true });

      function closeModal() {
        modal.remove();
        document.removeEventListener("keydown", closeOnEscape);
      }

      content.querySelector(".card-modal-close")
        .addEventListener("click", closeModal);

      modal.addEventListener("click", event => {
        if (event.target === modal) closeModal();
      });

      function closeOnEscape(event) {
        if (event.key === "Escape") closeModal();
      }

      document.addEventListener("keydown", closeOnEscape);
    }

    searchInput.addEventListener("input", renderCards);

    [
      typeFilter,
      brandFilter,
      coordinateFilter,
      categoryFilter,
      parallelFilter,
      rarityFilter
    ].forEach(select =>
      select.addEventListener("change", renderCards)
    );

    document.querySelectorAll(".status-button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".status-button").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        currentStatus = button.dataset.status;

        updateStatus();
        renderCards();
      });
    });

    document.getElementById("addSaleButton")
      .addEventListener("click", () => openSaleModal());

    const searchArea = document.querySelector(".search-box");

    if ("IntersectionObserver" in window) {
      const searchObserver = new IntersectionObserver(entries => {
        backToTop.classList.toggle(
          "visible",
          !entries[0].isIntersecting
        );
      }, { threshold: 0 });

      searchObserver.observe(searchArea);
    } else {
      window.addEventListener("scroll", () => {
        backToTop.classList.toggle("visible", window.scrollY > 200);
      });
    }

    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
