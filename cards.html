<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードコレクション</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .back-to-top {
      position: fixed;
      right: 18px;
      bottom: 24px;
      z-index: 999;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      background: rgba(65,48,83,0.88);
      color: #fff;
      font-size: 25px;
      line-height: 1;
      box-shadow: 0 3px 12px rgba(40,20,55,0.2);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ CARD COLLECTION ♡</p>
  </header>

  <main class="cards-page">
    <a href="index.html" class="back-link">‹ Collection</a>

    <section class="season-header">
      <h2 id="seasonTitle">第1弾</h2>
      <p id="collectionStatus">0 / 85</p>
      <div class="collection-progress" aria-label="コレクション進捗">
        <div class="collection-progress-bar" id="collectionProgressBar"></div>
      </div>
      <p class="collection-progress-text" id="collectionProgressText">0%</p>
    </section>

    <div class="search-box">
      <input type="search" id="searchInput" placeholder="カード番号・カード名を検索">
    </div>

    <div class="status-filters">
      <button class="status-button active" data-status="all">すべて</button>
      <button class="status-button" data-status="owned">所持</button>
      <button class="status-button" data-status="missing">未所持</button>
      <button class="status-button" data-status="trade">交換</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label for="typeFilter">タイプ</label>
        <select id="typeFilter">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="brandFilter">ブランド</label>
        <select id="brandFilter">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="coordinateFilter">コーデ</label>
        <select id="coordinateFilter">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="categoryFilter">カテゴリ</label>
        <select id="categoryFilter">
          <option value="">すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="parallelFilter">カード種類</label>
        <select id="parallelFilter">
          <option value="">すべて</option>
          <option value="normal">通常カード</option>
          <option value="parallel">パラレル</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="rarityFilter">レアリティ</label>
        <select id="rarityFilter">
          <option value="">すべて</option>
        </select>
      </div>
    </div>

    <div id="loading" class="loading">カードを読み込み中…</div>
    <div id="cardGrid" class="card-grid"></div>
  </main>

  <button type="button" id="backToTop" class="back-to-top"
    aria-label="ページの一番上へ" title="一番上へ">↑</button>

  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>

  <script>
    const params = new URLSearchParams(location.search);
    const season = params.get("season") || "1";
    const storageKey = `aikatsu-encore-season-${season}`;

    let cards = [];
    let ownership = {};
    let currentStatus = "all";

    const seasonTitle = document.getElementById("seasonTitle");
    const collectionStatus = document.getElementById("collectionStatus");
    const collectionProgressBar = document.getElementById("collectionProgressBar");
    const collectionProgressText = document.getElementById("collectionProgressText");
    const searchInput = document.getElementById("searchInput");
    const cardGrid = document.getElementById("cardGrid");
    const loading = document.getElementById("loading");

    const typeFilter = document.getElementById("typeFilter");
    const brandFilter = document.getElementById("brandFilter");
    const coordinateFilter = document.getElementById("coordinateFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const parallelFilter = document.getElementById("parallelFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    const backToTop = document.getElementById("backToTop");

    try {
      const savedOwnership = localStorage.getItem(storageKey);
      ownership = savedOwnership ? JSON.parse(savedOwnership) : {};

      if (!ownership || typeof ownership !== "object" || Array.isArray(ownership)) {
        ownership = {};
      }
    } catch (error) {
      console.error("所持数データを読み込めませんでした", error);
      ownership = {};
    }

    fetch("cards.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("cards.jsonを読み込めませんでした");
        }
        return response.json();
      })
      .then(data => {
        const allCards = Array.isArray(data) ? data : data.cards || [];

        cards = allCards.filter(card =>
          (!card.collection ||
            String(card.collection).toLowerCase() !== "promotion") &&
          String(card.season || "") === String(season)
        );

        seasonTitle.textContent = `第${season}弾`;

        setupFilters();
        updateStatus();
        renderCards();

        loading.style.display = "none";
      })
      .catch(error => {
        console.error(error);
        loading.textContent = "カードを読み込めませんでした。cards.jsonの場所を確認してね。";
      });

    /* フィルター項目 */
    function setupFilters() {
      fillFilter(typeFilter, "type");
      fillFilter(brandFilter, "brand");
      fillFilter(coordinateFilter, "coordinate");
      fillFilter(rarityFilter, "rarity");

      const categoryOrder = [
        "トップス",
        "ボトムス",
        "シューズ",
        "アクセサリー",
        "トップス＆ボトムス",
        "フルコーデ"
      ];

      const normalizeCategory = value => value.replace(/＆/g, "&");

      const categories = [...new Set(
        cards
          .map(card => String(card.category || "").trim())
          .filter(Boolean)
      )];

      categories.sort((a, b) => {
        const ai = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(a)
        );
        const bi = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(b)
        );

        if (ai === -1 && bi === -1) return a.localeCompare(b, "ja");
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });

      categories.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value.replace(
          "トップス&ボトムス",
          "トップス＆ボトムス"
        );
        categoryFilter.appendChild(option);
      });
    }

    function fillFilter(select, key) {
      const values = [...new Set(
        cards
          .map(card => card[key])
          .filter(value =>
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          )
          .map(value => String(value).trim())
      )].sort((a, b) => a.localeCompare(b, "ja"));

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    /* 所持数 */
    function getCount(card) {
      return Math.max(0, Number(ownership[card.id]) || 0);
    }

    function setCount(card, count) {
      if (count <= 0) {
        delete ownership[card.id];
      } else {
        ownership[card.id] = count;
      }

      try {
        localStorage.setItem(storageKey, JSON.stringify(ownership));
      } catch (error) {
        console.error("所持数を保存できませんでした", error);
        alert("所持数を保存できなかったよ。ブラウザの保存設定を確認してね。");
        return;
      }

      updateStatus();
      renderCards();
    }

    /* コレクション進捗 */
    function updateStatus() {
      const total = cards.length;
      const owned = cards.filter(card => getCount(card) >= 1).length;

      collectionStatus.textContent = `${owned} /
