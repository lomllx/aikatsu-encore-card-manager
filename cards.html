<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>第1弾 ♡ アイカツアンコール</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <header class="header">

    <a
      href="index.html"
      class="back-link"
    >
      ← HOME
    </a>

    <h1 id="seasonTitle">
      ✦ 第1弾 ✦
    </h1>

    <p>
      ♡ CARD COLLECTION ♡
    </p>

  </header>


  <main class="home">

    <!-- =========================
         コレクション状況
    ========================== -->

    <section class="menu-section collection-status">

      <div class="status-title">

        <strong>
          COLLECTION
        </strong>

        <span id="collectionCount">
          0 / 0
        </span>

      </div>

      <div class="progress">

        <div id="progressBar"></div>

      </div>

    </section>


    <!-- =========================
         検索
    ========================== -->

    <section class="menu-section">

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="カードを検索…"
      >

    </section>


    <!-- =========================
         絞り込み
    ========================== -->

    <section class="filter-area">

      <div class="filter-group">

        <label for="typeFilter">
          タイプ
        </label>

        <select id="typeFilter">

          <option value="">
            すべて
          </option>

        </select>

      </div>


      <div class="filter-group">

        <label for="brandFilter">
          ブランド
        </label>

        <select id="brandFilter">

          <option value="">
            すべて
          </option>

        </select>

      </div>


      <div class="filter-group">

        <label for="coordinateFilter">
          コーデ
        </label>

        <select id="coordinateFilter">

          <option value="">
            すべて
          </option>

        </select>

      </div>


      <div class="filter-group">

        <label for="categoryFilter">
          カテゴリ
        </label>

        <select id="categoryFilter">

          <option value="">
            すべて
          </option>

        </select>

      </div>

    </section>


    <!-- =========================
         所持状態
    ========================== -->

    <section class="filter-area status-filter-area">

      <button
        type="button"
        class="filter-button active"
        data-filter="all"
      >
        すべて
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="owned"
      >
        所持
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="missing"
      >
        未所持
      </button>

      <button
        type="button"
        class="filter-button"
        data-filter="trade"
      >
        交換
      </button>

    </section>


    <!-- =========================
         カード一覧
    ========================== -->

    <section
      id="cardList"
      class="card-grid"
    >

      <p class="loading">
        カードを読み込み中…
      </p>

    </section>

  </main>


  <script>

    /* =========================
       基本要素
    ========================= */

    const cardList =
      document.getElementById("cardList");

    const searchInput =
      document.getElementById("searchInput");

    const collectionCount =
      document.getElementById("collectionCount");

    const progressBar =
      document.getElementById("progressBar");

    const typeFilter =
      document.getElementById("typeFilter");

    const brandFilter =
      document.getElementById("brandFilter");

    const coordinateFilter =
      document.getElementById("coordinateFilter");

    const categoryFilter =
      document.getElementById("categoryFilter");

    const seasonTitle =
      document.getElementById("seasonTitle");


    /* =========================
       弾番号
    ========================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const season =
      params.get("season") || "1";


    /* =========================
       データ
    ========================== */

    let cards = [];

    let currentFilter = "all";


    /* =========================
       所持枚数
    ========================== */

    const STORAGE_KEY =
      "aikatsuOwned";

    let ownedCards =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "{}"
      );


    /* =========================
       アクセサリー判定
    ========================== */

    function isAccessory(card) {

      return String(
        card.category || ""
      ).trim() === "アクセサリー";

    }


    /* =========================
       カードデータ読み込み
    ========================== */

    async function loadCards() {

      try {

        const response =
          await fetch("cards.json");

        if (!response.ok) {

          throw new Error(
            "cards.jsonを読み込めませんでした"
          );

        }

        const allCards =
          await response.json();


        /* 弾ごとにカードを分ける */

        cards =
          allCards.filter(card => {

            return String(
              card.season || "1"
            ) === String(season);

          });


        seasonTitle.textContent =
          `✦ 第${season}弾 ✦`;


        createFilterOptions();

        renderCards();


      } catch (error) {

        cardList.innerHTML = `
          <p class="loading">
            カードデータを読み込めませんでした。
          </p>
        `;

        console.error(error);

      }

    }


    /* =========================
       所持枚数を取得
    ========================== */

    function getCount(cardId) {

      return ownedCards[cardId] || 0;

    }


    /* =========================
       所持枚数を変更
    ========================== */

    function changeCount(
      cardId,
      amount
    ) {

      const current =
        getCount(cardId);

      const next =
        Math.max(
          0,
          current + amount
        );

      ownedCards[cardId] =
        next;

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(ownedCards)
      );

      renderCards();

    }


    /* =========================
       絞り込み選択肢
    ========================== */

    function createFilterOptions() {

      addOptions(
        typeFilter,
        "type"
      );

      addOptions(
        brandFilter,
        "brand"
      );

      addOptions(
        coordinateFilter,
        "coordinate"
      );

      addOptions(
        categoryFilter,
        "category"
      );

    }


    function addOptions(
      select,
      property
    ) {

      const values = [
        ...new Set(
          cards
            .map(card => card[property])
            .filter(Boolean)
        )
      ];

      values.sort();

      values.forEach(value => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          value;

        option.textContent =
          value;

        select.appendChild(
          option
        );

      });

    }


    /* =========================
       カード拡大表示
    ========================== */

    function openCardModal(card) {

      const accessory =
        isAccessory(card);


      const modal =
        document.createElement("div");

      modal.className =
        "card-modal";


      const content =
        document.createElement("div");

      content.className =
        "card-modal-content";


      if (accessory) {

        content.classList.add(
          "accessory-modal"
        );

      }


      const backImage =
        card.backImage
          ? `
            <img
              src="${card.backImage}"
              alt="${card.name || card.id} 裏面"
            >
          `
          : "";


      content.innerHTML = `

        <button
          type="button"
          class="card-modal-close"
          aria-label="閉じる"
        >
          ×
        </button>


        <div class="modal-images">

          <img
            src="${card.image}"
            alt="${card.name || card.id}"
          >

          ${backImage}

        </div>

      `;


      modal.appendChild(content);

      document.body.appendChild(modal);


      /* 閉じるボタン */

      content
        .querySelector(".card-modal-close")
        .addEventListener(
          "click",
          () => {
            modal.remove();
          }
        );


      /* 背景タップで閉じる */

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target === modal
          ) {

            modal.remove();

          }

        }
      );

    }


    /* =========================
       カード表示
    ========================== */

    function renderCards() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();


      const selectedType =
        typeFilter.value;

      const selectedBrand =
        brandFilter.value;

      const selectedCoordinate =
        coordinateFilter.value;

      const selectedCategory =
        categoryFilter.value;


      /* =========================
         絞り込み
      ========================== */

      const filteredCards =
        cards.filter(card => {

          const id =
            String(
              card.id || ""
            ).toLowerCase();

          const name =
            String(
              card.name || ""
            ).toLowerCase();


          const matchesSearch =
            id.includes(keyword) ||
            name.includes(keyword);


          const matchesType =
            !selectedType ||
            card.type === selectedType;


          const matchesBrand =
            !selectedBrand ||
            card.brand === selectedBrand;


          const matchesCoordinate =
            !selectedCoordinate ||
            card.coordinate === selectedCoordinate;


          const matchesCategory =
            !selectedCategory ||
            card.category === selectedCategory;


          const count =
            getCount(card.id);


          let matchesStatus = true;


          if (
            currentFilter === "owned"
          ) {

            matchesStatus =
              count >= 1;

          }


          if (
            currentFilter === "missing"
          ) {

            matchesStatus =
              count === 0;

          }


          if (
            currentFilter === "trade"
          ) {

            matchesStatus =
              count >= 2;

          }


          return (
            matchesSearch &&
            matchesType &&
            matchesBrand &&
            matchesCoordinate &&
            matchesCategory &&
            matchesStatus
          );

        });


      /* =========================
         表示をクリア
      ========================== */

      cardList.innerHTML = "";


      if (
        filteredCards.length === 0
      ) {

        cardList.innerHTML = `
          <p class="loading">
            条件に一致するカードがありません。
          </p>
        `;

        updateCollection();

        return;

      }


      /* =========================
         カードを作成
      ========================== */

      filteredCards.forEach(card => {

        const count =
          getCount(card.id);

        const accessory =
          isAccessory(card);


        const cardElement =
          document.createElement(
            "article"
          );


        /* 通常 / アクセサリーを明確に分ける */

        cardElement.className =
          accessory
            ? "card accessory"
            : "card";


        /* 画像クラスも分ける */

        const imageClass =
          accessory
            ? "card-image accessory-image"
            : "card-image normal-image";


        cardElement.innerHTML = `

          <div class="${imageClass}">

            <img
              src="${card.image}"
              alt="${card.name || card.id}"
              onerror="this.style.display='none'"
            >

          </div>


          <div class="card-info">

            <strong>
              ${card.name || card.id}
            </strong>

            <small>
              ${card.id}
            </small>

          </div>


          <div class="count-control">

            <button
              type="button"
              class="minus"
            >
              −
            </button>


            <span>
              ${count}
            </span>


            <button
              type="button"
              class="plus"
            >
              ＋
            </button>

          </div>


          ${
            count >= 2
              ? `
                <div class="trade-badge">
                  ♡ 交換可能
                </div>
              `
              : ""
          }

        `;


        /* =========================
           カードタップ
        ========================== */

        cardElement
          .querySelector(".card-image")
          .addEventListener(
            "click",
            () => {
              openCardModal(card);
            }
          );


        /* =========================
           −ボタン
        ========================== */

        cardElement
          .querySelector(".minus")
          .addEventListener(
            "click",
            () => {
              changeCount(
                card.id,
                -1
              );
            }
          );


        /* =========================
           ＋ボタン
        ========================== */

        cardElement
          .querySelector(".plus")
          .addEventListener(
            "click",
            () => {
              changeCount(
                card.id,
                1
              );
            }
          );


        cardList.appendChild(
          cardElement
        );

      });


      updateCollection();

    }


    /* =========================
       コレクション状況
    ========================== */

    function updateCollection() {

      const total =
        cards.length;


      const owned =
        cards.filter(
          card =>
            getCount(card.id) >= 1
        ).length;


      collectionCount.textContent =
        `${owned} / ${total}`;


      const percentage =
        total === 0
          ? 0
          : (
              owned / total
            ) * 100;


      progressBar.style.width =
        `${percentage}%`;

    }


    /* =========================
       検索
    ========================== */

    searchInput.addEventListener(
      "input",
      renderCards
    );


    /* =========================
       4種類の絞り込み
    ========================== */

    [
      typeFilter,
      brandFilter,
      coordinateFilter,
      categoryFilter
    ].forEach(select => {

      select.addEventListener(
        "change",
        renderCards
      );

    });


    /* =========================
       所持状態フィルター
    ========================== */

    document
      .querySelectorAll(
        ".filter-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".filter-button"
              )
              .forEach(otherButton => {

                otherButton.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderCards();

          }
        );

      });


    /* =========================
       開始
    ========================== */

    loadCards();

  </script>

</body>

</html>
