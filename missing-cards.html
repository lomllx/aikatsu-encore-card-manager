

<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>未所持カード一覧｜アイカツ！アンコール</title>

  <style>

    :root {

      --bg: #fff8fc;

      --panel: #ffffff;

      --text: #55465a;

      --accent: #8d6b91;

      --border: #e7d9e9;

      --muted: #9b8b9e;

    }

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      padding: 20px;

      background: var(--bg);

      color: var(--text);

      font-family:

        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",

        "Yu Gothic", Meiryo, sans-serif;

    }

    .container {

      max-width: 1100px;

      margin: 0 auto;

    }

    h1 {

      margin: 0 0 8px;

      text-align: center;

      font-size: 25px;

      color: var(--accent);

    }

    .subtitle {

      margin: 0 0 22px;

      text-align: center;

      font-size: 13px;

      color: var(--muted);

    }

    .controls {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin-bottom: 18px;

      padding: 16px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 14px;

    }

    .controls label {

      font-size: 14px;

      font-weight: bold;

    }

    select,

    button,

    .back-link {

      min-height: 40px;

      padding: 8px 13px;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: white;

      color: var(--text);

      font-size: 14px;

    }

    button {

      cursor: pointer;

    }

    button:hover,

    .back-link:hover {

      background: #f7edf8;

    }

    .print-button {

      background: var(--accent);

      border-color: var(--accent);

      color: white;

    }

    .print-button:hover {

      background: #76567b;

      color: white;

    }

    .back-link {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

    }

    .summary {

      margin: 14px 0;

      text-align: center;

      font-size: 14px;

      line-height: 1.8;

    }

    .summary strong {

      color: var(--accent);

      font-size: 19px;

    }

    .card-grid {

      display: grid;

      grid-template-columns: repeat(5, minmax(0, 1fr));

      gap: 12px;

    }

    .card-item {

      min-width: 0;

      padding: 9px;

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 12px;

      break-inside: avoid;

      page-break-inside: avoid;

    }

    .card-image {

      display: block;

      width: 100%;

      aspect-ratio: 3 / 4;

      object-fit: contain;

      border-radius: 6px;

      background: #fcf8fc;

    }

    .card-name {

      margin-top: 8px;

      font-size: 12px;

      font-weight: bold;

      line-height: 1.5;

      overflow-wrap: anywhere;

    }

    .card-info {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.6;

      color: var(--muted);

      overflow-wrap: anywhere;

    }

    .rarity {

      display: inline-block;

      margin-top: 5px;

      padding: 2px 7px;

      border: 1px solid var(--border);

      border-radius: 20px;

      font-size: 10px;

      color: var(--accent);

    }

    .message {

      padding: 35px 12px;

      text-align: center;

      color: var(--muted);

      line-height: 1.8;

    }

    .error {

      color: #b44d67;

    }

    @media (max-width: 800px) {

      body {

        padding: 12px;

      }

      .card-grid {

        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 8px;

      }

      .card-item {

        padding: 6px;

      }

      h1 {

        font-size: 21px;

      }

    }

    @media (max-width: 380px) {

      .card-grid {

        grid-template-columns: repeat(2, minmax(0, 1fr));

      }

    }

    @media print {

      @page {

        size: A4 portrait;

        margin: 10mm;

      }

      body {

        padding: 0;

        background: white;

        color: #333;

      }

      .no-print {

        display: none !important;

      }

      h1 {

        font-size: 18px;

        color: #333;

      }

      .subtitle,

      .summary {

        color: #555;

      }

      .card-grid {

        grid-template-columns: repeat(5, minmax(0, 1fr));

        gap: 6px;

      }

      .card-item {

        padding: 4px;

        border: 1px solid #ddd;

        border-radius: 4px;

        background: white;

      }

      .card-image {

        background: white;

      }

      .card-name {

        font-size: 9px;

        color: #333;

      }

      .card-info {

        font-size: 8px;

        color: #555;

      }

      .rarity {

        font-size: 8px;

        color: #555;

        border-color: #ddd;

      }

    }

  </style>

</head>

<body>

  <main class="container">

    <h1 id="page-title">未所持カード一覧</h1>

    <p class="subtitle">アイカツ！アンコール｜未所持カードチェック用</p>

    <div class="controls no-print">

      <label for="rarity-filter">レアリティ</label>

      <select id="rarity-filter">

        <option value="ALL">すべて</option>

        <option value="SPR">SPR</option>

        <option value="PR">PR</option>

        <option value="ER">ER</option>

        <option value="CP">CP</option>

        <option value="R">R</option>

        <option value="N">N</option>

      </select>

      <button id="print-button" class="print-button" type="button">

        印刷・PDF保存

      </button>

      <a id="back-link" class="back-link" href="index.html">

        ホームへ戻る

      </a>

    </div>

    <div id="summary" class="summary">カード情報を読み込み中…</div>

    <div id="card-grid" class="card-grid"></div>

    <div id="message" class="message" hidden></div>

  </main>

  <script>

    const params = new URLSearchParams(location.search);

    const season = params.get("season") || "1";

    const grid = document.getElementById("card-grid");

    const summary = document.getElementById("summary");

    const message = document.getElementById("message");

    const rarityFilter = document.getElementById("rarity-filter");

    document.getElementById("page-title").textContent =

      `第${season}弾｜未所持カード一覧`;

    document.getElementById("back-link").href =

      `cards.html?season=${encodeURIComponent(season)}`;

    document.getElementById("print-button").addEventListener("click", () => {

      window.print();

    });

    function getOwnedCount(card) {

      const storageKey = `aikatsu-encore-season-${season}`;

      try {

        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");

        // 保存形式が {カードID: 所持数} の場合

        const value = saved[card.id];

        if (typeof value === "number") {

          return Math.max(0, value);

        }

        if (value && typeof value === "object") {

          const count = Number(value.count ?? value.owned ?? 0);

          return Number.isFinite(count) ? Math.max(0, count) : 0;

        }

        // 保存形式がカード配列の場合

        if (Array.isArray(saved)) {

          const found = saved.find(item => String(item.id) === String(card.id));

          if (!found) return 0;

          const count = Number(found.count ?? found.owned ?? 0);

          return Number.isFinite(count) ? Math.max(0, count) : 0;

        }

        return 0;

      } catch (error) {

        return 0;

      }

    }

    function normalizeRarity(value) {

      if (!value) return "";

      let rarity = String(value).trim().toUpperCase();

      const aliases = {

        "ノーマル": "N",

        "レア": "R",

        "キャンペーンレア": "CP",

        "キャンペーン": "CP",

        "エターナルレア": "ER",

        "プレミアムレア": "PR",

        "スーパープレミアムレア": "SPR"

      };

      if (aliases[rarity]) return aliases[rarity];

      // PARALLELなどの追加表記を取り除いてレアリティを判定

      rarity = rarity

        .replace(/_?PARALLEL$/i, "")

        .replace(/_?PARA$/i, "")

        .replace(/_?P$/i, "");

      const match = rarity.match(/(?:^|_)(SPR|PR|ER|CP|R|N)$/);

      return match ? match[1] : rarity;

    }

    function getCardRarity(card) {

      if (card.rarity) {

        return normalizeRarity(card.rarity);

      }

      return normalizeRarity(card.id || "");

    }

    function isPromotion(card) {

      return String(card.collection || "").toLowerCase() === "promotion";

    }

    function getImagePath(card) {

      return card.image || "";

    }

    function showMessage(text, isError = false) {

      message.hidden = false;

      message.textContent = text;

      message.classList.toggle("error", isError);

    }

    function render(cards) {

      grid.innerHTML = "";

      message.hidden = true;

      const unowned = cards.filter(card => getOwnedCount(card) === 0);

      const selectedRarity = rarityFilter.value;

      const filtered = unowned.filter(card => {

        if (selectedRarity === "ALL") return true;

        return getCardRarity(card) === selectedRarity;

      });

      summary.innerHTML =

        `第${season}弾　未所持カード：<strong>${filtered.length}</strong> 枚` +

        `<br>（未所持合計 ${unowned.length} 枚）`;

      if (filtered.length === 0) {

        showMessage(

          unowned.length === 0

            ? "この弾のカードはすべて所持済みだよ！"

            : "このレアリティに該当する未所持カードはないよ。"

        );

        return;

      }

      filtered.forEach(card => {

        const item = document.createElement("article");

        item.className = "card-item";

        const image = document.createElement("img");

        image.className = "card-image";

        image.alt = card.name || "カード画像";

        image.loading = "lazy";

        const imagePath = getImagePath(card);

        if (imagePath) {

          image.src = imagePath;

        } else {

          image.alt = "画像なし";

        }

        image.addEventListener("error", () => {

          image.style.display = "none";

        });

        const name = document.createElement("div");

        name.className = "card-name";

        name.textContent = card.name || card.id || "名称未設定";

        const info = document.createElement("div");

        info.className = "card-info";

        const details = [

          card.brand,

          card.type,

          card.coordinate

        ].filter(Boolean);

        info.textContent = details.join("｜");

        const rarity = document.createElement("span");

        rarity.className = "rarity";

        rarity.textContent = getCardRarity(card) || "レアリティ不明";

        item.append(image, name, info, rarity);

        grid.appendChild(item);

      });

    }

    async function loadCards() {

      try {

        const response = await fetch("cards.json");

        if (!response.ok) {

          throw new Error("cards.jsonを読み込めませんでした。");

        }

        const data = await response.json();

        const allCards = Array.isArray(data) ? data : data.cards;

        if (!Array.isArray(allCards)) {

          throw new Error("cards.jsonのデータ形式を確認してね。");

        }

        // プロモカードを除外し、選択中の弾だけ表示

        const seasonCards = allCards.filter(card =>

          !isPromotion(card) &&

          String(card.season) === String(season)

        );

        if (seasonCards.length === 0) {

          summary.textContent = "";

          showMessage(

            `第${season}弾のカードが見つからなかったよ。cards.jsonのseasonを確認してね。`

          );

          return;

        }

        rarityFilter.addEventListener("change", () => render(seasonCards));

        render(seasonCards);

      } catch (error) {

        summary.textContent = "";

        showMessage(

          "カード情報を読み込めなかったよ。cards.jsonの場所やデータを確認してね。",

          true

        );

        console.error(error);

      }

    }

    loadCards();

  </script>

</body>

</html>
