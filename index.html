<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツアンコール ♡ カードコレクション</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ゴスマジック風・共通デザイン */
    .profile-summary,
    .collection-summary {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 18px 0;
      padding: 18px;
      border: 1px solid rgba(193, 166, 239, 0.38);
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(119, 83, 166, 0.24), transparent 48%),
        radial-gradient(ellipse at 100% 100%, rgba(95, 125, 191, 0.15), transparent 45%),
        linear-gradient(145deg, rgba(31, 24, 45, 0.97), rgba(13, 15, 29, 0.97));
      color: #f4efff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        0 8px 24px rgba(4, 3, 15, 0.16);
    }

    .profile-summary::before,
    .collection-summary::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        125deg,
        transparent 10%,
        rgba(255, 255, 255, 0.045) 35%,
        transparent 55%
      );
    }

    .collection-summary-title {
      margin: 0 0 15px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-align: center;
      color: #eee0ff;
      text-shadow: 0 0 12px rgba(191, 154, 255, 0.32);
    }

    /* プロフィール画像 */
    .profile-image-frame {
      position: relative;
      width: 100%;
      max-width: 290px;
      margin: 0 auto 17px;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgba(207, 183, 255, 0.68);
      border-radius: 15px;
      background: linear-gradient(
        135deg,
        rgba(231, 211, 255, 0.3),
        rgba(115, 88, 159, 0.1),
        rgba(165, 214, 255, 0.2)
      );
      box-shadow:
        0 0 18px rgba(154, 115, 219, 0.15),
        inset 0 0 12px rgba(255, 255, 255, 0.08);
    }

    .profile-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 360px;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 10px;
    }

    .profile-info,
    .collection-summary-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .collection-summary-item {
      min-width: 0;
      padding: 12px 8px;
      border: 1px solid rgba(197, 177, 241, 0.19);
      border-radius: 12px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.075),
        rgba(180, 157, 230, 0.035)
      );
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
    }

    .collection-summary-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.78rem;
      color: #c9bddf;
    }

    .collection-summary-value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fffaff;
      text-shadow: 0 0 10px rgba(197, 166, 255, 0.18);
    }

    .profile-official-link {
      margin: 15px 0 0;
      text-align: center;
    }

    .profile-official-link a {
      display: inline-block;
      padding: 9px 15px;
      border: 1px solid rgba(190, 167, 238, 0.36);
      border-radius: 999px;
      background: rgba(163, 131, 217, 0.09);
      color: #e3d4ff;
      font-size: 0.83rem;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .profile-official-link a:hover {
      background: rgba(163, 131, 217, 0.18);
      border-color: rgba(214, 194, 255, 0.65);
    }

    /* コレクション進捗 */
    .collection-summary-bar {
      height: 12px;
      margin-top: 16px;
      padding: 2px;
      overflow: hidden;
      border: 1px solid rgba(190, 168, 235, 0.25);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    .collection-summary-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #7760ad,
        #b9a1f1 48%,
        #c7e7ff
      );
      box-shadow: 0 0 10px rgba(174, 148, 255, 0.55);
      transition: width 0.35s ease;
    }

    .collection-summary-status {
      margin: 9px 0 0;
      font-size: 0.8rem;
      text-align: right;
      color: #d4c6ed;
    }

    @media (max-width: 360px) {
      .profile-summary,
      .collection-summary {
        padding: 14px;
      }

      .collection-summary-value {
        font-size: 1.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .collection-summary-bar-fill,
      .profile-official-link a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ CARD COLLECTION ♡</p>
  </header>

  <main class="home">

    <!-- ① マイプロフィール -->
    <section class="profile-summary" aria-label="マイプロフィール">
      <h2 class="collection-summary-title">✦ My Profile ✦</h2>

      <div class="profile-image-frame">
        <img
          src="profile.jpg"
          alt="マイプロフィール画像"
          class="profile-image"
        >
      </div>

      <div class="profile-info">
        <div class="collection-summary-item">
          <span class="collection-summary-label">ニックネーム</span>
          <strong class="collection-summary-value">すもも</strong>
        </div>

        <div class="collection-summary-item">
          <span class="collection-summary-label">アイドルプレート</span>
          <strong class="collection-summary-value" style="font-size: 1rem;">
            未設定
          </strong>
        </div>
      </div>

      <p class="profile-official-link">
        <a
          href="https://dcd.aikatsu.com/encore/mypage/profiles"
          target="_blank"
          rel="noopener noreferrer"
        >♡ 公式マイページを開く ↗</a>
      </p>
    </section>

    <!-- ② 登録カード枚数 -->
    <section class="collection-summary" aria-label="カードコレクション">
      <h2 class="collection-summary-title">✦ My Collection ✦</h2>

      <div class="collection-summary-stats">
        <div class="collection-summary-item">
          <span class="collection-summary-label">登録カード枚数</span>
          <strong class="collection-summary-value" id="registeredCardCount">
            0 枚
          </strong>
        </div>

        <div class="collection-summary-item">
          <span class="collection-summary-label">所持カード種類数</span>
          <strong class="collection-summary-value" id="registeredCardKinds">
            0 種
          </strong>
        </div>
      </div>

      <!-- ③ 全カードに対するコレクション進捗 -->
      <div
        class="collection-summary-bar"
        id="registeredCardProgress"
        role="progressbar"
        aria-label="公開カード種類数に対する所持進捗"
        aria-valuemin="0"
        aria-valuemax="0"
        aria-valuenow="0"
      >
        <div
          class="collection-summary-bar-fill"
          id="registeredCardProgressFill"
        ></div>
      </div>

      <p class="collection-summary-status" id="registeredCardProgressText">
        0 / 0 種
      </p>
    </section>

    <!-- Collection -->
    <section class="menu-section">
      <button
        type="button"
        class="section-title"
        id="collectionToggle"
        aria-expanded="true"
        aria-controls="collectionList"
      >
        ♡ Collection
        <span id="collectionArrow">▼</span>
      </button>

      <div id="collectionList" class="collection-list">
        <a href="all-cards.html" class="season-link">
          <span>♡ 全体コレクション</span>
          <span>›</span>
        </a>

        <div id="seasonLinks"></div>

        <a
          href="promotion.html"
          class="season-link promotion-link"
          id="promotionLink"
        >
          <span>♡ プロモーションカード</span>
          <span id="promotionCount">›</span>
        </a>
      </div>
    </section>

    <!-- Trade -->
    <section class="menu-section">
      <a href="trade.html" class="menu-link">
        <span>
          <strong>♡ Trade</strong>
          <small>交換可能カード</small>
        </span>
        <span>›</span>
      </a>
    </section>

    <!-- Information -->
<section class="menu-section">
  <a
    href="https://dcd.aikatsu.com/encore/"
    class="menu-link"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span>
      <strong>♡ Information</strong>
      <small>アイカツ情報</small>
    </span>
    <span>›</span>
  </a>
</section>

  </main>

  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>

  <script>
    const collectionToggle = document.getElementById("collectionToggle");
    const collectionList = document.getElementById("collectionList");
    const collectionArrow = document.getElementById("collectionArrow");
    const seasonLinks = document.getElementById("seasonLinks");
    const promotionCount = document.getElementById("promotionCount");

    let allCards = [];

    /* Collection 開閉 */
    collectionToggle.addEventListener("click", () => {
      const isOpen = collectionToggle.getAttribute("aria-expanded") === "true";

      collectionToggle.setAttribute("aria-expanded", String(!isOpen));
      collectionList.style.display = isOpen ? "none" : "block";
      collectionArrow.textContent = isOpen ? "▶" : "▼";
    });

    /* 保存データを安全に読み込む */
    function readOwnership(storageKey) {
      try {
        const saved = localStorage.getItem(storageKey);
        if (!saved) return {};

        const parsed = JSON.parse(saved);

        return (
          parsed &&
          typeof parsed === "object" &&
          !Array.isArray(parsed)
        ) ? parsed : {};
      } catch (error) {
        console.warn(`${storageKey} のデータを読み込めませんでした`, error);
        return {};
      }
    }

    /* プロモーションカードか判定 */
    function isPromotion(card) {
      return String(card.collection || "").toLowerCase() === "promotion";
    }

    /* カードごとの保存キー */
    function getStorageKey(card) {
      if (isPromotion(card)) {
        return "aikatsu-encore-promotion";
      }

      const season = String(card.season || "1");
      return `aikatsu-encore-season-${season}`;
    }

    /* 所持枚数を安全に整数化 */
    function getCopies(ownership, id) {
      const count = Number(ownership[id] || 0);

      if (!Number.isFinite(count) || count <= 0) {
        return 0;
      }

      return Math.floor(count);
    }

    /* 登録枚数・所持種類数・進捗を更新 */
    function updateCollectionSummary(cards) {
      let totalCopies = 0;

      const ownedIds = new Set();
      const allIds = new Set();
      const ownershipByKey = {};

      cards.forEach(card => {
        if (card.id === undefined || card.id === null) {
          return;
        }

        const id = String(card.id);
        const storageKey = getStorageKey(card);

        /*
         * 弾ごと・プロモごとのIDを区別して集計する。
         * 同じカードの重複所持は枚数に加算するが、
         * 種類数には1回だけ加算する。
         */
        const uniqueKey = `${storageKey}:${id}`;
        allIds.add(uniqueKey);

        if (!ownershipByKey[storageKey]) {
          ownershipByKey[storageKey] = readOwnership(storageKey);
        }

        const ownership = ownershipByKey[storageKey];
        const copies = getCopies(ownership, id);

        if (copies > 0) {
          totalCopies += copies;
          ownedIds.add(uniqueKey);
        }
      });

      const totalKinds = allIds.size;
      const ownedKinds = ownedIds.size;

      const progress = totalKinds > 0
        ? Math.min((ownedKinds / totalKinds) * 100, 100)
        : 0;

      document.getElementById("registeredCardCount").textContent =
        `${totalCopies.toLocaleString("ja-JP")} 枚`;

      document.getElementById("registeredCardKinds").textContent =
        `${ownedKinds.toLocaleString("ja-JP")} 種`;

      document.getElementById("registeredCardProgressFill").style.width =
        `${progress}%`;

      const progressBar = document.getElementById("registeredCardProgress");
      progressBar.setAttribute("aria-valuemax", String(totalKinds));
      progressBar.setAttribute("aria-valuenow", String(ownedKinds));

      document.getElementById("registeredCardProgressText").textContent =
        `${ownedKinds.toLocaleString("ja-JP")} / ${totalKinds.toLocaleString("ja-JP")} 種`;
    }

    /* cards.json を読み込む */
    async function loadCards() {
      try {
        const response = await fetch("cards.json");

        if (!response.ok) {
          throw new Error("cards.jsonを読み込めませんでした");
        }

        const data = await response.json();

        allCards = Array.isArray(data)
          ? data
          : Array.isArray(data.cards)
            ? data.cards
            : [];

        createSeasonLinks(allCards);
        updatePromotionLink(allCards);
        updateCollectionSummary(allCards);

      } catch (error) {
        console.error(error);

        seasonLinks.textContent = "カード情報を読み込めませんでした。";
        promotionCount.textContent = "›";

        document.getElementById("registeredCardProgressText").textContent =
          "カード情報を読み込めませんでした";
      }
    }

    /* 通常カードを弾ごとに表示 */
    function createSeasonLinks(cards) {
      const normalCards = cards.filter(card => !isPromotion(card));

      const seasons = [
        ...new Set(normalCards.map(card => String(card.season || "1")))
      ].sort((a, b) => Number(a) - Number(b));

      seasonLinks.innerHTML = "";

      seasons.forEach(season => {
        const seasonCards = normalCards.filter(
          card => String(card.season || "1") === season
        );

        const ownership = readOwnership(
          `aikatsu-encore-season-${season}`
        );

        const owned = seasonCards.filter(
          card => getCopies(ownership, String(card.id)) >= 1
        ).length;

        const link = document.createElement("a");
        link.href = `cards.html?season=${encodeURIComponent(season)}`;
        link.className = "season-link";

        const label = document.createElement("span");
        label.textContent = `第${season}弾`;

        const count = document.createElement("span");
        count.textContent = `${owned} / ${seasonCards.length}　›`;

        link.appendChild(label);
        link.appendChild(count);
        seasonLinks.appendChild(link);
      });
    }

    /* プロモーションカードの所持数 */
    function updatePromotionLink(cards) {
      const promotionCards = cards.filter(isPromotion);
      const ownership = readOwnership("aikatsu-encore-promotion");

      const owned = promotionCards.filter(
        card => getCopies(ownership, String(card.id)) >= 1
      ).length;

      promotionCount.textContent = promotionCards.length > 0
        ? `${owned} / ${promotionCards.length}　›`
        : "›";
    }

    /* 他ページから戻ったときなどに再集計 */
    function refreshHome() {
      updateCollectionSummary(allCards);
      createSeasonLinks(allCards);
      updatePromotionLink(allCards);
    }

    window.addEventListener("pageshow", refreshHome);

    window.addEventListener("storage", event => {
      if (
        event.key === null ||
        /^aikatsu-encore-season-.+$/.test(event.key) ||
        event.key === "aikatsu-encore-promotion"
      ) {
        refreshHome();
      }
    });

    loadCards();
  </script>
</body>
</html>
