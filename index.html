<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツアンコール ♡ カードコレクション</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ CARD COLLECTION ♡</p>
  </header>

  <main class="home">

    <!-- Collection -->
    <section class="menu-section">

      <button class="section-title" id="collectionToggle">
        ♡ Collection
        <span id="collectionArrow">▼</span>
      </button>

      <div id="collectionList" class="collection-list">

        <a href="cards.html?season=1" class="season-link">
          <span>第1弾</span>
          <span>0 / 85　›</span>
        </a>

        <a href="cards.html?season=2" class="season-link">
          <span>第2弾</span>
          <span>準備中　›</span>
        </a>

        <a href="cards.html?season=3" class="season-link">
          <span>第3弾</span>
          <span>準備中　›</span>
        </a>

      </div>

    </section>


    <!-- Trade -->
    <section class="menu-section">

      <a href="trade.html" class="menu-link">
        <span>
          <strong>♡ Trade</strong>
          <small>交換可能カード</small>
        </span>

        <span>›</span>
      </a>

    </section>


    <!-- My Character -->
    <section class="menu-section">

      <a href="character.html" class="menu-link">
        <span>
          <strong>♡ My Character</strong>
          <small>マイキャラ</small>
        </span>

        <span>›</span>
      </a>

    </section>


    <!-- Information -->
    <section class="menu-section">

      <a href="information.html" class="menu-link">
        <span>
          <strong>♡ Information</strong>
          <small>アイカツ情報</small>
        </span>

        <span>›</span>
      </a>

    </section>

  </main>


  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>


  <script>

    const collectionToggle =
      document.getElementById("collectionToggle");

    const collectionList =
      document.getElementById("collectionList");

    const collectionArrow =
      document.getElementById("collectionArrow");


    collectionToggle.addEventListener("click", () => {

      const isOpen =
        collectionList.style.display !== "none";

      if (isOpen) {

        collectionList.style.display = "none";
        collectionArrow.textContent = "▶";

      } else {

        collectionList.style.display = "block";
        collectionArrow.textContent = "▼";

      }

    });

  </script>

</body>
</html>
