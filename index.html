<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツアンコール ♡ カードコレクション</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ CARD COLLECTION ♡</p>
  </header>


  <main class="home">

    <!-- Collection -->

    <section class="menu-section">

      <button
        class="section-title"
        id="collectionToggle"
      >
        ♡ Collection
        <span id="collectionArrow">▼</span>
      </button>


      <div
        id="collectionList"
        class="collection-list"
      >

        <!-- 全体コレクション -->

        <a
          href="all-cards.html"
          class="season-link"
        >
          <span>♡ 全体コレクション</span>
          <span>›</span>
        </a>


        <!-- 各弾 -->

        <div id="seasonLinks"></div>


        <!-- プロモーション -->

        <a
          href="promotion.html"
          class="season-link promotion-link"
          id="promotionLink"
        >
          <span>♡ プロモーションカード</span>
          <span id="promotionCount">›</span>
        </a>

      </div>

    </section>


    <!-- Trade -->

    <section class="menu-section">

      <a
        href="trade.html"
        class="menu-link"
      >

        <span>
          <strong>♡ Trade</strong>
          <small>交換可能カード</small>
        </span>

        <span>›</span>

      </a>

    </section>


    <!-- My Character -->

    <section class="menu-section">

      <a
        href="character.html"
        class="menu-link"
      >

        <span>
          <strong>♡ My Character</strong>
          <small>マイキャラ</small>
        </span>

        <span>›</span>

      </a>

    </section>


    <!-- Information -->

    <section class="menu-section">

      <a
        href="information.html"
        class="menu-link"
      >

        <span>
          <strong>♡ Information</strong>
          <small>アイカツ情報</small>
        </span>

        <span>›</span>

      </a>

    </section>

  </main>


  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>


  <script>

    const collectionToggle =
      document.getElementById(
        "collectionToggle"
      );

    const collectionList =
      document.getElementById(
        "collectionList"
      );

    const collectionArrow =
      document.getElementById(
        "collectionArrow"
      );

    const seasonLinks =
      document.getElementById(
        "seasonLinks"
      );

    const promotionCount =
      document.getElementById(
        "promotionCount"
      );


    /* =========================
       Collection 開閉
    ========================= */

    collectionToggle.addEventListener(
      "click",
      () => {

        const isOpen =
          collectionList.style.display !== "none";


        if (isOpen) {

          collectionList.style.display =
            "none";

          collectionArrow.textContent =
            "▶";

        } else {

          collectionList.style.display =
            "block";

          collectionArrow.textContent =
            "▼";

        }

      }
    );


    /* =========================
       プロモーションかどうか
    ========================= */

    function isPromotion(card) {

      return (
        String(
          card.collection || ""
        ).toLowerCase() === "promotion"
      );

    }


    /* =========================
       カード情報を読み込む
    ========================= */

    function loadSeasonLinks() {

      fetch("cards.json")
        .then(response => {

          if (!response.ok) {

            throw new Error(
              "cards.jsonを読み込めませんでした"
            );

          }

          return response.json();

        })
        .then(data => {

          const cards =
            Array.isArray(data)
              ? data
              : data.cards || [];


          createSeasonLinks(cards);

          updatePromotionLink(cards);

        })
        .catch(error => {

          console.error(error);

          seasonLinks.innerHTML = `
            <p>
              カード情報を読み込めませんでした。
            </p>
          `;

        });

    }


    /* =========================
       通常弾だけを弾ごとに表示
    ========================= */

    function createSeasonLinks(cards) {

      /*
        プロモーションカードを除外
        通常弾だけをここで扱う
      */

      const normalCards =
        cards.filter(
          card => !isPromotion(card)
        );


      const seasons = [
        ...new Set(
          normalCards.map(card =>
            String(
              card.season || "1"
            )
          )
        )
      ]
      .sort(
        (a, b) =>
          Number(a) - Number(b)
      );


      seasonLinks.innerHTML = "";


      seasons.forEach(season => {

        const seasonCards =
          normalCards.filter(card =>
            String(
              card.season || "1"
            ) === season
          );


        const ownership =
          JSON.parse(
            localStorage.getItem(
              `aikatsu-encore-season-${season}`
            ) || "{}"
          );


        const owned =
          seasonCards.filter(card =>
            Number(
              ownership[card.id] || 0
            ) >= 1
          ).length;


        const link =
          document.createElement("a");


        link.href =
          `cards.html?season=${season}`;


        link.className =
          "season-link";


        link.innerHTML = `

          <span>
            第${season}弾
          </span>

          <span>
            ${owned} / ${seasonCards.length}　›
          </span>

        `;


        seasonLinks.appendChild(
          link
        );

      });

    }


    /* =========================
       プロモーションカードの所持数
    ========================= */

    function updatePromotionLink(cards) {

      const promotionCards =
        cards.filter(
          card => isPromotion(card)
        );


      const ownership =
        JSON.parse(
          localStorage.getItem(
            "aikatsu-encore-promotion"
          ) || "{}"
        );


      const owned =
        promotionCards.filter(card =>
          Number(
            ownership[card.id] || 0
          ) >= 1
        ).length;


      promotionCount.textContent =
        promotionCards.length > 0
          ? `${owned} / ${promotionCards.length}　›`
          : "›";

    }


    /* =========================
       ページを開いたとき・
       Safariで戻ってきたときに更新
    ========================= */

    window.addEventListener(
      "pageshow",
      () => {

        loadSeasonLinks();

      }
    );

  </script>

</body>
</html>
