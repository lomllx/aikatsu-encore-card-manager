<!DOCTYPEhtml>
<htmllang="ja">
<head>
<metacharset="UTF-8">
<metaname="viewport"content="width=device-width,initial-scale=1.0">
<title>プロモーションカード</title>
<linkrel="stylesheet"href="style.css">
</head>

<body>

<headerclass="header">
<h1>✦AIKATSUENCORE✦</h1>
<p>♡PROMOTIONCARD♡</p>
</header>

<mainclass="cards-page">

<ahref="index.html"class="back-link">
‹Collection
</a>

<sectionclass="season-header">
<h2>♡プロモーションカード</h2>
<pid="collectionStatus">0/0</p>
</section>


<!--検索-->

<divclass="search-box">
<input
type="search"
id="searchInput"
placeholder="カード番号・カード名を検索"
>
</div>


<!--所持状態-->

<divclass="status-filters">

<button
class="status-buttonactive"
data-status="all"
>
すべて
</button>

<button
class="status-button"
data-status="owned"
>
所持
</button>

<button
class="status-button"
data-status="missing"
>
未所持
</button>

<button
class="status-button"
data-status="trade"
>
交換
</button>

</div>


<!--フィルター-->

<divclass="filters">

<divclass="filter-group">
<labelfor="typeFilter">タイプ</label>

<selectid="typeFilter">
<optionvalue="">すべて</option>
</select>
</div>


<divclass="filter-group">
<labelfor="brandFilter">ブランド</label>

<selectid="brandFilter">
<optionvalue="">すべて</option>
</select>
</div>


<divclass="filter-group">
<labelfor="coordinateFilter">コーデ</label>

<selectid="coordinateFilter">
<optionvalue="">すべて</option>
</select>
</div>


<divclass="filter-group">
<labelfor="categoryFilter">カテゴリ</label>

<selectid="categoryFilter">
<optionvalue="">すべて</option>
</select>
</div>

</div>


<divid="loading"class="loading">
プロモーションカードを読み込み中…
</div>

<div
id="cardGrid"
class="card-grid"
></div>

</main>


<footer>
<p>♡AIKATSUENCORE♡</p>
</footer>


<script>

/*=========================
基本設定
=========================*/

conststorageKey=
"aikatsu-encore-promotion";

letcards=[];

letownership={};

letcurrentStatus="all";


/*=========================
要素
=========================*/

constcollectionStatus=
document.getElementById(
"collectionStatus"
);

constsearchInput=
document.getElementById(
"searchInput"
);

constcardGrid=
document.getElementById(
"cardGrid"
);

constloading=
document.getElementById(
"loading"
);

consttypeFilter=
document.getElementById(
"typeFilter"
);

constbrandFilter=
document.getElementById(
"brandFilter"
);

constcoordinateFilter=
document.getElementById(
"coordinateFilter"
);

constcategoryFilter=
document.getElementById(
"categoryFilter"
);


/*=========================
所持データ
=========================*/

functionloadOwnership(){

ownership=
JSON.parse(

localStorage.getItem(
storageKey
)||"{}"

);

}


/*=========================
JSON読み込み
=========================*/

fetch("cards.json")

.then(response=>{

if(!response.ok){

thrownewError(
"cards.jsonを読み込めませんでした"
);

}

returnresponse.json();

})

.then(data=>{

constallCards=
Array.isArray(data)
?data
:data.cards||[];


/*
collectionがpromotionの
カードだけを取得
*/

cards=
allCards.filter(card=>

String(
card.collection||""
).toLowerCase()==="promotion"

);


loadOwnership();

setupFilters();

updateStatus();

renderCards();

loading.style.display="none";

})

.catch(error=>{

console.error(error);

loading.textContent=
"カードを読み込めませんでした。";

});


/*=========================
フィルター設定
=========================*/

functionsetupFilters(){

fillFilter(
typeFilter,
"type"
);

fillFilter(
brandFilter,
"brand"
);

fillFilter(
coordinateFilter,
"coordinate"
);

fillFilter(
categoryFilter,
"category"
);

}


functionfillFilter(
select,
key
){

constvalues=[

...newSet(

cards

.map(card=>
card[key]
)

.filter(value=>

value!==undefined&&
value!==null&&
String(value).trim()!==""

)

.map(value=>
String(value).trim()
)

)

].sort(

(a,b)=>
a.localeCompare(
b,
"ja"
)

);


values.forEach(value=>{

constoption=
document.createElement(
"option"
);

option.value=
value;

option.textContent=
value;

select.appendChild(
option
);

});

}


/*=========================
所持数
=========================*/

functiongetCount(card){

returnNumber(
ownership[card.id]||0
);

}


functionsetCount(
card,
count
){

if(count<=0){

deleteownership[card.id];

}else{

ownership[card.id]=
count;

}


localStorage.setItem(
storageKey,
JSON.stringify(
ownership
)
);


updateStatus();

renderCards();

}


/*=========================
集計
=========================*/

functionupdateStatus(){

constowned=
cards.filter(
card=>
getCount(card)>=1
).length;


collectionStatus.textContent=
`${owned}/${cards.length}`;

}


/*=========================
フィルター
=========================*/

functiongetFilteredCards(){

constkeyword=
searchInput.value
.toLowerCase()
.trim();


consttype=
typeFilter.value;

constbrand=
brandFilter.value;

constcoordinate=
coordinateFilter.value;

constcategory=
categoryFilter.value;


returncards.filter(card=>{

constsearchableText=[

card.id,
card.name,
card.unit,
card.brand,
card.coordinate,
card.type,
card.category,
card.rarity

]

.filter(value=>
value!==undefined&&
value!==null
)

.join("")
.toLowerCase();


constcount=
getCount(card);


if(
keyword&&
!searchableText.includes(
keyword
)
){

returnfalse;

}


if(
type&&
String(
card.type||""
).trim()!==type
){

returnfalse;

}


if(
brand&&
String(
card.brand||""
).trim()!==brand
){

returnfalse;

}


if(
coordinate&&
String(
card.coordinate||""
).trim()!==coordinate
){

returnfalse;

}


if(
category&&
String(
card.category||""
).trim()!==category
){

returnfalse;

}


if(
currentStatus==="owned"&&
count<1
){

returnfalse;

}


if(
currentStatus==="missing"&&
count>=1
){

returnfalse;

}


if(
currentStatus==="trade"&&
count<2
){

returnfalse;

}


returntrue;

});

}


/*=========================
カード表示
=========================*/

functionrenderCards(){

cardGrid.innerHTML="";


constfiltered=
getFilteredCards();


if(
filtered.length===0
){

cardGrid.innerHTML=
`<pclass="no-results">
該当するカードがありません。
</p>`;

return;

}


filtered.forEach(card=>{

constcount=
getCount(card);


constcardElement=
document.createElement(
"article"
);


cardElement.className=
"card";


cardElement.innerHTML=`

<divclass="card-image">

<img
src="${card.image}"
alt="${card.name||card.id}"
onerror="this.style.display='none'"
>

</div>


<divclass="card-info">

<divclass="card-id">
${card.id||""}
</div>

<divclass="card-name">
${card.name||""}
</div>

<divclass="card-meta">
${card.brand||""}
</div>

${
card.rarity
?`<divclass="card-rarity">
${card.rarity}
</div>`
:""
}

${
count>=2
?`<divclass="trade-label">
♡交換可能
</div>`
:""
}

</div>


<divclass="count-control">

<button
type="button"
class="count-buttonminus"
>
−
</button>

<spanclass="count">
${count}
</span>

<button
type="button"
class="count-buttonplus"
>
＋
</button>

</div>

`;


/*−*/

cardElement
.querySelector(".minus")
.addEventListener(
"click",
event=>{

event.stopPropagation();

setCount(
card,
Math.max(
0,
count-1
)
);

}
);


/*＋*/

cardElement
.querySelector(".plus")
.addEventListener(
"click",
event=>{

event.stopPropagation();

setCount(
card,
count+1
);

}
);


/*カード*/

cardElement.addEventListener(
"click",
()=>
openCardModal(card)
);


cardGrid.appendChild(
cardElement
);

});

}


/*=========================
カード詳細モーダル
=========================*/

functionopenCardModal(card){

constmodal=
document.createElement(
"div"
);

modal.className=
"card-modal";


constcontent=
document.createElement(
"div"
);

content.className=
"card-modal-content";


content.innerHTML=`

<button
type="button"
class="card-modal-close"
aria-label="閉じる"
>
×
</button>


<divclass="modal-card-area">

<button
type="button"
class="card-side-arrowleft"
aria-label="表を見る"
>
‹
</button>


<img
class="modal-card-image"
src="${card.image}"
alt="${card.name||card.id}"
>


<button
type="button"
class="card-side-arrowright"
aria-label="裏を見る"
>
›
</button>

</div>


<divclass="card-side-buttons">

<button
type="button"
class="card-side-buttonactive"
data-side="front"
>
表
</button>

<button
type="button"
class="card-side-button"
data-side="back"
>
裏
</button>

</div>

`;


modal.appendChild(
content
);

document.body.appendChild(
modal
);


constimage=
content.querySelector(
".modal-card-image"
);


constfrontButton=
content.querySelector(
'[data-side="front"]'
);


constbackButton=
content.querySelector(
'[data-side="back"]'
);


constleftArrow=
content.querySelector(
".card-side-arrow.left"
);


constrightArrow=
content.querySelector(
".card-side-arrow.right"
);


/*=========================
表/裏
=========================*/

functionshowSide(side){

if(
side==="back"&&
card.backImage
){

image.src=
card.backImage;

image.alt=
`${card.name||card.id}裏面`;

frontButton
.classList
.remove("active");

backButton
.classList
.add("active");

}else{

image.src=
card.image;

image.alt=
`${card.name||card.id}`;

frontButton
.classList
.add("active");

backButton
.classList
.remove("active");

}

}


frontButton.addEventListener(
"click",
event=>{

event.stopPropagation();

showSide("front");

}
);


backButton.addEventListener(
"click",
event=>{

event.stopPropagation();

showSide("back");

}
);


/*=========================
左右矢印
=========================*/

functiontoggleSide(){

constisBack=
image.src===
card.backImage;


if(isBack){

showSide("front");

}else{

showSide("back");

}

}


leftArrow.addEventListener(
"click",
event=>{

event.stopPropagation();

toggleSide();

}
);


rightArrow.addEventListener(
"click",
event=>{

event.stopPropagation();

toggleSide();

}
);


/*=========================
左右タップ
=========================*/

constcardArea=
content.querySelector(
".modal-card-area"
);


cardArea.addEventListener(
"click",
event=>{

if(
event.target.classList.contains(
"card-side-arrow"
)
){

return;

}


constrect=
cardArea.getBoundingClientRect();


consttapX=
event.clientX-
rect.left;


if(
tapX<
rect.width/2
){

showSide("front");

}else{

showSide("back");

}

}
);


/*=========================
スワイプ
=========================*/

lettouchStartX=0;


cardArea.addEventListener(
"touchstart",
event=>{

touchStartX=
event.changedTouches[0]
.screenX;

},
{passive:true}
);


cardArea.addEventListener(
"touchend",
event=>{

consttouchEndX=
event.changedTouches[0]
.screenX;


constdistance=
touchEndX-
touchStartX;


if(
Math.abs(distance)<
50
){

return;

}


if(
distance<0
){

showSide("back");

}else{

showSide("front");

}

},
{passive:true}
);


/*=========================
閉じる
=========================*/

constclose=
()=>modal.remove();


content
.querySelector(
".card-modal-close"
)
.addEventListener(
"click",
close
);


modal.addEventListener(
"click",
event=>{

if(
event.target===modal
){

close();

}

}
);

}


/*=========================
イベント
=========================*/

searchInput.addEventListener(
"input",
renderCards
);


[
typeFilter,
brandFilter,
coordinateFilter,
categoryFilter

].forEach(select=>{

select.addEventListener(
"change",
renderCards
);

});


document
.querySelectorAll(
".status-button"
)
.forEach(button=>{

button.addEventListener(
"click",
()=>{

document
.querySelectorAll(
".status-button"
)
.forEach(button=>
button.classList.remove(
"active"
)
);


button.classList.add(
"active"
);


currentStatus=
button.dataset.status;


renderCards();

}
);

});


/*=========================
戻ってきたとき更新
=========================*/

window.addEventListener(
"pageshow",
()=>{

if(
cards.length>0
){

loadOwnership();

updateStatus();

renderCards();

}

}
);

</script>

</body>
</html>
