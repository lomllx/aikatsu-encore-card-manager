<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交換できるカード</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <a href="index.html" class="back-link">← ホームへ戻る</a>

    <h1>♡ 交換できるカード</h1>

    <p class="page-description">
      2枚以上持っているカードを表示します
    </p>

    <input
      type="search"
      id="search"
      class="search-box"
      placeholder="カード名・カード番号で検索"
    >

    <div id="season-buttons" class="season-buttons"></div>

    <div id="card-list" class="card-list"></div>

    <p id="empty-message" class="empty-message">
      交換できるカードはありません。
    </p>

  </main>

<script>

let allCards = [];
let selectedSeason = "all";

const cardList = document.getElementById("card-list");
const emptyMessage = document.getElementById("empty-message");
const searchInput = document.getElementById("search");
const seasonButtons = document.getElementById("season-buttons");


// ==============================
// データ読み込み
// ==============================

async function loadCards() {

  const response = await fetch("cards.json");
  allCards = await response.json();

  createSeasonButtons();
  renderCards();
}


// ==============================
// シーズンボタン
// ==============================

function createSeasonButtons() {

  seasonButtons.innerHTML = "";

  const allButton = document.createElement("button");

  allButton.textContent = "すべて";
  allButton.className = "season-button active";

  allButton.addEventListener("click", () => {

    selectedSeason = "all";

    updateSeasonButtons();
    renderCards();

  });

  seasonButtons.appendChild(allButton);


  // 通常弾
  const seasons = [
    ...new Set(
      allCards
        .filter(card => card.collection !== "promotion")
        .map(card => card.season)
        .filter(Boolean)
    )
  ].sort((a, b) => Number(a) - Number(b));


  seasons.forEach(season => {

    const button = document.createElement("button");

    button.textContent = `第${season}弾`;

    button.className = "season-button";

    button.dataset.season = season;

    button.addEventListener("click", () => {

      selectedSeason = String(season);

      updateSeasonButtons();
      renderCards();

    });

    seasonButtons.appendChild(button);

  });


  // プロモーション
  const promotionCards = allCards.filter(
    card => card.collection === "promotion"
  );

  if (promotionCards.length > 0) {

    const button = document.createElement("button");

    button.textContent = "♡ プロモ";

    button.className = "season-button";

    button.dataset.season = "promotion";

    button.addEventListener("click", () => {

      selectedSeason = "promotion";

      updateSeasonButtons();
      renderCards();

    });

    seasonButtons.appendChild(button);
  }
}


// ==============================
// ボタン状態
// ==============================

function updateSeasonButtons() {

  document
    .querySelectorAll(".season-button")
    .forEach(button => {

      const buttonSeason =
        button.dataset.season || "all";

      button.classList.toggle(
        "active",
        buttonSeason === selectedSeason
      );

    });
}


// ==============================
// 所持数
// ==============================

function getStorageKey(card) {

  if (card.collection === "promotion") {
    return "aikatsu-encore-promotion";
  }

  return `aikatsu-encore-season-${card.season}`;
}


function getOwnedCount(card) {

  const key = getStorageKey(card);

  const data = JSON.parse(
    localStorage.getItem(key) || "{}"
  );

  return Number(data[card.id] || 0);
}


// ==============================
// カード描画
// ==============================

function renderCards() {

  cardList.innerHTML = "";

  const keyword =
    searchInput.value.trim().toLowerCase();


  let cards = allCards.filter(card => {

    const ownedCount = getOwnedCount(card);

    // 交換対象は2枚以上
    if (ownedCount < 2) {
      return false;
    }


    // シーズン
    if (selectedSeason === "promotion") {

      if (card.collection !== "promotion") {
        return false;
      }

    } else if (selectedSeason !== "all") {

      if (
        card.collection === "promotion" ||
        String(card.season) !== selectedSeason
      ) {
        return false;
      }

    }


    // 検索
    if (keyword) {

      const text = [
        card.id,
        card.name,
        card.unit,
        card.brand,
        card.coordinate,
        card.type,
        card.category
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      if (!text.includes(keyword)) {
        return false;
      }
    }

    return true;

  });


  // 並び順
  cards.sort((a, b) => {

    // プロモは最後
    if (
      a.collection === "promotion" &&
      b.collection !== "promotion"
    ) {
      return 1;
    }

    if (
      a.collection !== "promotion" &&
      b.collection === "promotion"
    ) {
      return -1;
    }

    return a.id.localeCompare(b.id, undefined, {
      numeric: true
    });

  });


  emptyMessage.style.display =
    cards.length === 0 ? "block" : "none";


  cards.forEach(card => {

    const count = getOwnedCount(card);

    const cardElement =
      document.createElement("div");

    cardElement.className = "card-item";


    const image = document.createElement("img");

    image.src = card.image;
    image.alt = card.name || card.id;
    image.loading = "lazy";


    const info =
      document.createElement("div");

    info.className = "card-info";


    const id =
      document.createElement("div");

    id.className = "card-id";
    id.textContent = card.id;


    const name =
      document.createElement("div");

    name.className = "card-name";
    name.textContent = card.name || "";


    const countText =
      document.createElement("div");

    countText.className = "trade-count";

    countText.textContent =
      `交換 ${count - 1}枚`;


    info.appendChild(id);
    info.appendChild(name);
    info.appendChild(countText);


    cardElement.appendChild(image);
    cardElement.appendChild(info);


    cardElement.addEventListener("click", () => {

      if (card.collection === "promotion") {

        location.href =
          "promotion.html";

      } else {

        location.href =
          `cards.html?season=${card.season}`;

      }

    });


    cardList.appendChild(cardElement);

  });

}


// ==============================
// 検索
// ==============================

searchInput.addEventListener(
  "input",
  renderCards
);


// ==============================
// Safari 戻る対策
// ==============================

window.addEventListener(
  "pageshow",
  renderCards
);


loadCards();

</script>

</body>
</html>
