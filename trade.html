<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トレード</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body.trade-page {
      min-height: 100vh;
      color: #f4f2ff;
      background:
        radial-gradient(ellipse at 15% 5%, rgba(76,95,185,.22), transparent 40%),
        radial-gradient(ellipse at 90% 30%, rgba(137,92,206,.16), transparent 38%),
        linear-gradient(160deg,#090e25,#10152f 50%,#17102e);
    }

    .trade-page .header {
      background:
        radial-gradient(ellipse at 50% 100%,rgba(127,157,255,.16),transparent 65%),
        transparent;
    }

    .trade-container {
      width: min(100% - 24px, 1000px);
      margin: 0 auto;
      padding: 16px 0 36px;
    }

    .trade-back-link {
      display: inline-block;
      margin-bottom: 14px;
      color: #d6d8ff;
      text-decoration: none;
    }

    .trade-heading {
      margin: 8px 0 22px;
      text-align: center;
      color: #e9e5ff;
      letter-spacing: .08em;
      text-shadow: 0 0 18px rgba(154,173,255,.45);
    }

    .trade-panel {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid rgba(174,191,255,.25);
      border-radius: 18px;
      background:
        linear-gradient(140deg,rgba(255,255,255,.065),transparent 55%),
        rgba(16,23,52,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .trade-panel-title {
      margin: 0 0 14px;
      text-align: center;
      font-size: .95rem;
      letter-spacing: .08em;
      color: #e2e7ff;
    }

    .trade-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .trade-summary-item {
      padding: 12px 8px;
      border: 1px solid rgba(174,191,255,.18);
      border-radius: 12px;
      background: rgba(157,175,255,.07);
      text-align: center;
    }

    .trade-summary-label {
      display: block;
      margin-bottom: 5px;
      font-size: .76rem;
      color: #becbf0;
    }

    .trade-summary-value {
      display: block;
      font-size: 1.2rem;
      color: white;
      overflow-wrap: anywhere;
    }

    .trade-search, .trade-select {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(174,191,255,.28);
      border-radius: 10px;
      outline: none;
      background: #111a3a;
      color: #f4f2ff;
      font: inherit;
      font-size: .88rem;
    }

    .trade-search::placeholder {
      color: #9ba9d3;
    }

    .trade-search:focus, .trade-select:focus {
      border-color: #a8c5ff;
      box-shadow: 0 0 0 3px rgba(133,167,255,.12);
    }

    .trade-status-filters {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      gap: 7px;
      margin: 12px 0;
    }

    .trade-status-button, .trade-reset-button {
      min-height: 40px;
      padding: 8px 6px;
      border: 1px solid rgba(174,191,255,.25);
      border-radius: 10px;
      background: rgba(133,153,229,.07);
      color: #dce3ff;
      font: inherit;
      font-size: .82rem;
      cursor: pointer;
    }

    .trade-status-button.active {
      border-color: rgba(189,204,255,.8);
      background: linear-gradient(120deg,rgba(100,125,214,.48),rgba(151,112,212,.36));
      color: white;
    }

    .trade-filters {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px;
    }

    .trade-filter-group {
      min-width: 0;
    }

    .trade-filter-group label {
      display: block;
      margin-bottom: 6px;
      color: #c7d1f8;
      font-size: .8rem;
    }

    .trade-filter-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .trade-results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 22px 2px 12px;
      color: #e5e8ff;
    }

    .trade-results-heading h2 {
      margin: 0;
      font-size: 1rem;
    }

    .trade-results-count {
      color: #bdcafa;
      font-size: .82rem;
      white-space: nowrap;
    }

    .trade-card-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 10px;
    }

    .trade-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(167,190,255,.22);
      border-radius: 13px;
      background: linear-gradient(155deg,rgba(38,49,91,.8),rgba(17,22,49,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }

    .trade-card-image {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: rgba(6,10,27,.7);
      cursor: pointer;
    }

    .trade-card-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .trade-card-info {
      padding: 9px 8px 10px;
    }

    .trade-card-id {
      margin-bottom: 4px;
      color: #aebdf1;
      font-size: .68rem;
      overflow-wrap: anywhere;
    }

    .trade-card-name {
      margin-bottom: 7px;
      color: #f6f5ff;
      font-size: .8rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .trade-card-meta {
      margin-bottom: 7px;
      color: #c2ccef;
      font-size: .7rem;
      overflow-wrap: anywhere;
    }

    .trade-available {
      display: inline-block;
      padding: 4px 7px;
      border: 1px solid rgba(166,203,255,.3);
      border-radius: 999px;
      background: rgba(124,169,255,.12);
      color: #dceaff;
      font-size: .72rem;
    }

    .trade-count-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 6px 12px;
      border-top: 1px solid rgba(174,191,255,.15);
    }

    .trade-count-button {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 1px solid rgba(174,191,255,.4);
      border-radius: 50%;
      background: rgba(133,153,229,.16);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .trade-count-button:active {
      background: rgba(151,166,255,.4);
    }

    .trade-count-number {
      min-width: 24px;
      text-align: center;
      font-size: 1rem;
      color: #fff;
    }

    .trade-no-results, .trade-error {
      grid-column: 1 / -1;
      padding: 24px 12px;
      border: 1px dashed rgba(174,191,255,.22);
      border-radius: 14px;
      color: #c2ccef;
      text-align: center;
      line-height: 1.7;
    }

    .trade-error {
      color: #ffd9e9;
    }

    .trade-page footer {
      color: #b7c4f1;
      text-align: center;
    }

    @media (min-width: 700px) {
      .trade-filters {
        grid-template-columns: repeat(3,minmax(0,1fr));
      }

      .trade-card-grid {
        grid-template-columns: repeat(5,minmax(0,1fr));
        gap: 14px;
      }

      .trade-container {
        width: min(100% - 40px,1000px);
      }
    }

    @media (max-width: 360px) {
      .trade-panel {
        padding: 12px;
      }

      .trade-count-control {
        gap: 7px;
      }

      .trade-count-button {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .trade-status-button {
        font-size: .76rem;
      }
    }
  </style>
</head>

<body class="trade-page">
  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ COSMIC TRADE ♡</p>
  </header>

  <main class="trade-container">
    <a href="index.html" class="trade-back-link">← ホームへ戻る</a>

    <h1 class="trade-heading">トレード</h1>

    <section class="trade-panel" aria-label="交換可能カードの集計">
      <div class="trade-summary">
        <div class="trade-summary-item">
          <span class="trade-summary-label">交換可能なカード種類</span>
          <strong class="trade-summary-value" id="tradeKindsCount">0 種</strong>
        </div>
        <div class="trade-summary-item">
          <span class="trade-summary-label">交換可能な合計枚数</span>
          <strong class="trade-summary-value" id="tradeCopiesCount">0 枚</strong>
        </div>
      </div>
    </section>

    <section class="trade-panel" aria-label="カード検索とフィルター">
      <input
        type="search"
        id="searchInput"
        class="trade-search"
        placeholder="カード番号・カード名を検索"
        autocomplete="off"
      >

      <div class="trade-status-filters" aria-label="所持状態">
        <button type="button" class="trade-status-button active" data-status="all">すべて</button>
        <button type="button" class="trade-status-button" data-status="owned">所持</button>
        <button type="button" class="trade-status-button" data-status="missing">未所持</button>
        <button type="button" class="trade-status-button" data-status="trade">交換</button>
      </div>

      <div class="trade-filters">
        <div class="trade-filter-group">
          <label for="typeFilter">タイプ</label>
          <select id="typeFilter" class="trade-select">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="trade-filter-group">
          <label for="brandFilter">ブランド</label>
          <select id="brandFilter" class="trade-select">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="trade-filter-group">
          <label for="coordinateFilter">コーデ</label>
          <select id="coordinateFilter" class="trade-select">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="trade-filter-group">
          <label for="categoryFilter">カテゴリ</label>
          <select id="categoryFilter" class="trade-select">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="trade-filter-group">
          <label for="rarityFilter">レアリティ</label>
          <select id="rarityFilter" class="trade-select">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="trade-filter-group">
          <label for="parallelFilter">カード種類</label>
          <select id="parallelFilter" class="trade-select">
            <option value="">すべて</option>
            <option value="normal">通常</option>
            <option value="parallel">パラレル</option>
          </select>
        </div>
      </div>

      <div class="trade-filter-actions">
        <button type="button" class="trade-reset-button" id="resetFilters">
          条件をリセット
        </button>
      </div>
    </section>

    <div class="trade-results-heading">
      <h2>✧ TRADE CARDS ✧</h2>
      <span class="trade-results-count" id="resultsCount">0 種</span>
    </div>

    <section
      id="cardGrid"
      class="trade-card-grid"
      aria-label="交換可能カード一覧"
      aria-live="polite"
    ></section>

    <p id="loadingMessage" class="trade-no-results">カードを読み込んでいます…</p>
  </main>

  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>

  <script>
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const brandFilter = document.getElementById("brandFilter");
    const coordinateFilter = document.getElementById("coordinateFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const rarityFilter = document.getElementById("rarityFilter");
    const parallelFilter = document.getElementById("parallelFilter");
    const cardGrid = document.getElementById("cardGrid");
    const loadingMessage = document.getElementById("loadingMessage");
    const resultsCount = document.getElementById("resultsCount");

    const filterElements = [
      typeFilter,
      brandFilter,
      coordinateFilter,
      categoryFilter,
      rarityFilter,
      parallelFilter
    ];

    let allCards = [];
    let currentStatus = "all";
    let ownershipByKey = {};

    function isPromotion(card) {
      return String(card.collection || "").toLowerCase() === "promotion";
    }

    function getStorageKey(card) {
      if (isPromotion(card)) {
        return "aikatsu-encore-promotion";
      }
      return `aikatsu-encore-season-${String(card.season || "1")}`;
    }

    function readOwnership(storageKey) {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return parsed &&
          typeof parsed === "object" &&
          !Array.isArray(parsed)
          ? parsed
          : {};
      } catch (error) {
        console.warn("所持数の読み込みに失敗しました", error);
        return {};
      }
    }

    function getOwnershipMap(card) {
      const key = getStorageKey(card);
      if (!ownershipByKey[key]) {
        ownershipByKey[key] = readOwnership(key);
      }
      return ownershipByKey[key];
    }

    function getOwnedCount(card) {
      const map = getOwnershipMap(card);
      const count = Number(map[String(card.id)] || 0);
      return Number.isFinite(count) && count > 0
        ? Math.floor(count)
        : 0;
    }

    function setOwnedCount(card, newCount) {
      const storageKey = getStorageKey(card);
      const ownership = getOwnershipMap(card);
      const count = Math.max(0, Math.floor(Number(newCount) || 0));
      const id = String(card.id);

      const previousValue = localStorage.getItem(storageKey);

      if (count <= 0) {
        delete ownership[id];
      } else {
        ownership[id] = count;
      }

      try {
        localStorage.setItem(storageKey, JSON.stringify(ownership));
      } catch (error) {
        // 保存に失敗したら、画面上の変更も元に戻す
        if (previousValue === null) {
          delete ownershipByKey[storageKey];
        } else {
          try {
            ownershipByKey[storageKey] = JSON.parse(previousValue);
          } catch (_) {
            delete ownershipByKey[storageKey];
          }
        }
        alert("所持数を保存できなかったよ。ブラウザの保存設定を確認してね。");
        return;
      }

      ownershipByKey[storageKey] = ownership;
      updateSummary();
      renderCards();
    }

    function getTradeCount(card) {
      return Math.max(0, getOwnedCount(card) - 1);
    }

    function getRarity(card) {
      if (
        card.rarity !== undefined &&
        card.rarity !== null &&
        String(card.rarity).trim() !== ""
      ) {
        return String(card.rarity).trim().toUpperCase();
      }

      const id = String(card.id || "").trim();
      const match = id.match(/_(SPR|PR|CP|ER|R|N)$/i);
      return match ? match[1].toUpperCase() : "";
    }

    function isParallel(card) {
      return card.parallel === true ||
        /(?:_PARALLEL|_PARA|_P)$/i.test(String(card.id || ""));
    }

    function getSearchableText(card) {
      return [
        card.id,
        card.name,
        card.unit,
        card.brand,
        card.coordinate,
        card.type,
        card.category,
        getRarity(card),
        card.season,
        card.collection
      ]
        .filter(value => value !== undefined && value !== null)
        .join(" ")
        .toLowerCase();
    }

    function fillFilter(select, values) {
      const uniqueValues = [...new Set(
        values.map(value => String(value || "").trim()).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ja"));

      uniqueValues.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function setupFilters() {
      fillFilter(typeFilter, allCards.map(card => card.type));
      fillFilter(brandFilter, allCards.map(card => card.brand));
      fillFilter(coordinateFilter, allCards.map(card => card.coordinate));
      fillFilter(rarityFilter, allCards.map(card => getRarity(card)));

      const categoryOrder = [
        "トップス",
        "ボトムス",
        "シューズ",
        "アクセサリー",
        "トップス＆ボトムス",
        "トップス&ボトムス",
        "フルコーデ"
      ];

      const normalizeCategory = value => value.replace(/＆/g, "&");
      const categories = [
        ...new Set(
          allCards.map(card => String(card.category || "").trim()).filter(Boolean)
        )
      ];

      categories.sort((a, b) => {
        const ai = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(a)
        );
        const bi = categoryOrder.findIndex(
          item => normalizeCategory(item) === normalizeCategory(b)
        );
        if (ai === -1 && bi === -1) return a.localeCompare(b, "ja");
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });

      categories.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value.replace(
          "トップス&ボトムス",
          "トップス＆ボトムス"
        );
        categoryFilter.appendChild(option);
      });
    }

    function getFilteredCards() {
      const keyword = searchInput.value.trim().toLowerCase();

      return allCards.filter(card => {
        if (card.id === undefined || card.id === null) return false;

        const ownedCount = getOwnedCount(card);

        // トレードページには重複カードだけを表示する
        if (ownedCount < 2) return false;

        if (keyword && !getSearchableText(card).includes(keyword)) {
          return false;
        }

        if (typeFilter.value &&
            String(card.type || "").trim() !== typeFilter.value) {
          return false;
        }

        if (brandFilter.value &&
            String(card.brand || "").trim() !== brandFilter.value) {
          return false;
        }

        if (coordinateFilter.value &&
            String(card.coordinate || "").trim() !== coordinateFilter.value) {
          return false;
        }

        const category = String(card.category || "").trim()
          .replace("トップス&ボトムス", "トップス＆ボトムス");

        const selectedCategory = categoryFilter.value
          .replace("トップス&ボトムス", "トップス＆ボトムス");

        if (selectedCategory && category !== selectedCategory) {
          return false;
        }

        if (rarityFilter.value && getRarity(card) !== rarityFilter.value) {
          return false;
        }

        if (parallelFilter.value === "parallel" && !isParallel(card)) {
          return false;
        }

        if (parallelFilter.value === "normal" && isParallel(card)) {
          return false;
        }

        if (currentStatus === "missing") return false;
        if (currentStatus === "owned" && ownedCount < 1) return false;
        if (currentStatus === "trade" && getTradeCount(card) < 1) {
          return false;
        }

        return true;
      });
    }

    function updateSummary() {
      const tradeCards = allCards.filter(
        card => card.id !== undefined &&
          card.id !== null &&
          getOwnedCount(card) >= 2
      );

      const tradeCopies = tradeCards.reduce(
        (sum, card) => sum + getTradeCount(card),
        0
      );

      document.getElementById("tradeKindsCount").textContent =
        `${tradeCards.length.toLocaleString("ja-JP")} 種`;

      document.getElementById("tradeCopiesCount").textContent =
        `${tradeCopies.toLocaleString("ja-JP")} 枚`;
    }

    function appendText(parent, className, text) {
      const element = document.createElement("div");
      element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function renderCards() {
      cardGrid.innerHTML = "";
      const filteredCards = getFilteredCards();

      resultsCount.textContent =
        `${filteredCards.length.toLocaleString("ja-JP")} 種`;

      loadingMessage.style.display = "none";

      if (filteredCards.length === 0) {
        const message = document.createElement("p");
        message.className = "trade-no-results";
        message.textContent = currentStatus === "missing"
          ? "重複カードのみを表示するため、未所持カードはありません。"
          : "条件に合う交換可能カードがありません。";
        cardGrid.appendChild(message);
        return;
      }

      filteredCards.sort((a, b) => {
        const aPromo = isPromotion(a);
        const bPromo = isPromotion(b);

        if (aPromo && !bPromo) return 1;
        if (!aPromo && bPromo) return -1;

        const seasonOrder =
          Number(a.season || 0) - Number(b.season || 0);

        if (!aPromo && !bPromo && seasonOrder !== 0) {
          return seasonOrder;
        }

        return String(a.id).localeCompare(String(b.id), undefined, {
          numeric: true
        });
      });

      filteredCards.forEach(card => {
        const count = getOwnedCount(card);
        const tradeCount = getTradeCount(card);

        const cardElement = document.createElement("article");
        cardElement.className = "trade-card";

        const imageWrap = document.createElement("div");
        imageWrap.className = "trade-card-image";
        imageWrap.setAttribute("role", "link");
        imageWrap.setAttribute("tabindex", "0");
        imageWrap.setAttribute(
          "aria-label",
          `${card.name || card.id} のカードページを開く`
        );

        const image = document.createElement("img");
        image.src = card.image || "";
        image.alt = card.name || card.id;
        image.loading = "lazy";
        image.onerror = () => {
          image.style.display = "none";
        };
        imageWrap.appendChild(image);

        const openCardPage = () => {
          if (isPromotion(card)) {
            location.href = "promotion.html";
          } else {
            location.href =
              `cards.html?season=${encodeURIComponent(String(card.season || "1"))}`;
          }
        };

        imageWrap.addEventListener("click", openCardPage);
        imageWrap.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCardPage();
          }
        });

        const info = document.createElement("div");
        info.className = "trade-card-info";

        appendText(info, "trade-card-id", card.id);
        appendText(info, "trade-card-name", card.name || "名称未設定");

        const meta = [card.brand, getRarity(card)].filter(Boolean).join(" · ");
        if (meta) appendText(info, "trade-card-meta", meta);

        appendText(info, "trade-card-meta", `所持 ${count} 枚`);

        const badge = document.createElement("span");
        badge.className = "trade-available";
        badge.textContent = `交換可能 ${tradeCount} 枚`;
        info.appendChild(badge);

        const countControl = document.createElement("div");
        countControl.className = "trade-count-control";

        const minusButton = document.createElement("button");
        minusButton.type = "button";
        minusButton.className = "trade-count-button";
        minusButton.textContent = "−";
        minusButton.setAttribute("aria-label", "所持数を1枚減らす");
        minusButton.disabled = count <= 0;

        const countNumber = document.createElement("span");
        countNumber.className = "trade-count-number";
        countNumber.textContent = String(count);
        countNumber.setAttribute("aria-live", "polite");

        const plusButton = document.createElement("button");
        plusButton.type = "button";
        plusButton.className = "trade-count-button";
        plusButton.textContent = "＋";
        plusButton.setAttribute("aria-label", "所持数を1枚増やす");

        // ボタン操作でカードページへの移動が起きないようにする
        minusButton.addEventListener("click", event => {
          event.stopPropagation();
          setOwnedCount(card, Math.max(0, getOwnedCount(card) - 1));
        });

        plusButton.addEventListener("click", event => {
          event.stopPropagation();
          setOwnedCount(card, getOwnedCount(card) + 1);
        });

        countControl.append(minusButton, countNumber, plusButton);
        cardElement.append(imageWrap, info, countControl);
        cardGrid.appendChild(cardElement);
      });
    }

    document.querySelectorAll(".trade-status-button").forEach(button => {
      button.addEventListener("click", () => {
        currentStatus = button.dataset.status || "all";

        document.querySelectorAll(".trade-status-button").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        renderCards();
      });
    });

    searchInput.addEventListener("input", renderCards);
    filterElements.forEach(select => {
      select.addEventListener("change", renderCards);
    });

    document.getElementById("resetFilters").addEventListener("click", () => {
      searchInput.value = "";
      filterElements.forEach(select => {
        select.value = "";
      });

      currentStatus = "all";
      document.querySelectorAll(".trade-status-button").forEach(button => {
        button.classList.toggle("active", button.dataset.status === "all");
      });

      renderCards();
    });

    // 他のタブで所持数が変わったときにも再読み込み
    window.addEventListener("storage", event => {
      if (
        event.key === null ||
        /^aikatsu-encore-season-.+$/.test(event.key) ||
        event.key === "aikatsu-encore-promotion"
      ) {
        ownershipByKey = {};
        updateSummary();
        renderCards();
      }
    });

    // 戻る操作などでページが再表示されたら最新データを読み直す
    window.addEventListener("pageshow", () => {
      ownershipByKey = {};
      if (allCards.length) {
        updateSummary();
        renderCards();
      }
    });

    async function loadCards() {
      try {
        const response = await fetch("cards.json");
        if (!response.ok) {
          throw new Error("cards.jsonを読み込めませんでした");
        }

        const data = await response.json();
        allCards = Array.isArray(data)
          ? data
          : Array.isArray(data.cards)
            ? data.cards
            : [];

        ownershipByKey = {};
        setupFilters();
        updateSummary();
        renderCards();
      } catch (error) {
        console.error(error);
        loadingMessage.textContent =
          "カード情報を読み込めませんでした。cards.jsonの場所を確認してね。";
        loadingMessage.className = "trade-error";
        loadingMessage.style.display = "block";
      }
    }

    loadCards();
  </script>
</body>
</html>
