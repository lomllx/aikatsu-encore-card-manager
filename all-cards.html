<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全体コレクション</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>✦ AIKATSU ENCORE ✦</h1>
    <p>♡ ALL COLLECTION ♡</p>
  </header>


  <main class="cards-page">

    <a href="index.html" class="back-link">
      ‹ Collection
    </a>


    <section class="season-header">
      <h2>全体コレクション</h2>
      <p id="overallStatus">読み込み中…</p>
    </section>


    <!-- =========================
         通常弾 / プロモ切り替え
    ========================= -->

    <div class="collection-scope">

      <button
        type="button"
        class="scope-button active"
        data-scope="season"
      >
        通常弾のみ
      </button>

      <button
        type="button"
        class="scope-button"
        data-scope="all"
      >
        プロモ含む
      </button>

    </div>


    <!-- =========================
         検索
    ========================= -->

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="カード番号・カード名・ブランドなどを検索"
      >

    </div>


    <!-- =========================
         所持状態
    ========================= -->

    <div class="status-filters">

      <button
        class="status-button active"
        data-status="all"
      >
        すべて
      </button>

      <button
        class="status-button"
        data-status="owned"
      >
        所持
      </button>

      <button
        class="status-button"
        data-status="missing"
      >
        未所持
      </button>

      <button
        class="status-button"
        data-status="trade"
      >
        交換
      </button>

    </div>


    <!-- =========================
         4種類のフィルター
    ========================= -->

    <div class="filters">

      <div class="filter-group">

        <label for="typeFilter">
          タイプ
        </label>

        <select id="typeFilter">
          <option value="">
            すべて
          </option>
        </select>

      </div>


      <div class="filter-group">

        <label for="brandFilter">
          ブランド
        </label>

        <select id="brandFilter">
          <option value="">
            すべて
          </option>
        </select>

      </div>


      <div class="filter-group">

        <label for="coordinateFilter">
          コーデ
        </label>

        <select id="coordinateFilter">
          <option value="">
            すべて
          </option>
        </select>

      </div>


      <div class="filter-group">

        <label for="categoryFilter">
          カテゴリ
        </label>

        <select id="categoryFilter">
          <option value="">
            すべて
          </option>
        </select>

      </div>

    </div>


    <!-- =========================
         全体集計
    ========================= -->

    <section class="overall-summary">

      <div class="summary-card">

        <span>
          ♡ 所持
        </span>

        <strong id="ownedCount">
          0
        </strong>

      </div>


      <div class="summary-card">

        <span>
          ♡ 未所持
        </span>

        <strong id="missingCount">
          0
        </strong>

      </div>


      <div class="summary-card">

        <span>
          ♡ 交換
        </span>

        <strong id="tradeCount">
          0
        </strong>

      </div>

    </section>


    <!-- =========================
         カード一覧
    ========================= -->

    <div id="cardList"></div>


    <div
      id="noResults"
      class="no-results"
      style="display:none;"
    >
      該当するカードがありません。
    </div>


  </main>


  <footer>
    <p>♡ AIKATSU ENCORE ♡</p>
  </footer>


  <script>

    /* =========================
       基本設定
    ========================= */

    let cards = [];

    let ownershipBySeason = {};

    let currentScope = "season";

    let currentStatus = "all";


    /* =========================
       要素
    ========================= */

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const typeFilter =
      document.getElementById(
        "typeFilter"
      );


    const brandFilter =
      document.getElementById(
        "brandFilter"
      );


    const coordinateFilter =
      document.getElementById(
        "coordinateFilter"
      );


    const categoryFilter =
      document.getElementById(
        "categoryFilter"
      );


    const cardList =
      document.getElementById(
        "cardList"
      );


    const noResults =
      document.getElementById(
        "noResults"
      );


    /* =========================
       JSON読み込み
    ========================= */

    fetch("cards.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "cards.jsonを読み込めませんでした"
          );

        }

        return response.json();

      })

      .then(data => {

        cards =
          Array.isArray(data)
            ? data
            : data.cards || [];


        loadOwnership();

        setupFilters();

        renderAll();

      })

      .catch(error => {

        console.error(error);

        document.getElementById(
          "overallStatus"
        ).textContent =
          "カードを読み込めませんでした。";

      });


    /* =========================
       通常弾かどうか
    ========================= */

    function isPromotion(card) {

      return (
        String(
          card.collection || ""
        ).toLowerCase() === "promotion"
      );

    }


    /* =========================
       所持データ読み込み
    ========================= */

    function loadOwnership() {

      const seasons = [
        ...new Set(

          cards

            .filter(card =>
              !isPromotion(card)
            )

            .map(card =>
              String(
                card.season || "1"
              )
            )

        )
      ];


      seasons.forEach(season => {

        const storageKey =
          `aikatsu-encore-season-${season}`;


        ownershipBySeason[season] =
          JSON.parse(

            localStorage.getItem(
              storageKey
            ) || "{}"

          );

      });


      /* プロモ */

      ownershipBySeason.promotion =
        JSON.parse(

          localStorage.getItem(
            "aikatsu-encore-promotion"
          ) || "{}"

        );

    }


    /* =========================
       所持数
    ========================= */

    function getCount(card) {

      let ownership;


      if (isPromotion(card)) {

        ownership =
          ownershipBySeason.promotion || {};

      } else {

        const season =
          String(
            card.season || "1"
          );

        ownership =
          ownershipBySeason[season] || {};

      }


      return Number(
        ownership[card.id] || 0
      );

    }


    /* =========================
       フィルター項目
    ========================= */

    function setupFilters() {

      fillFilter(
        typeFilter,
        "type"
      );


      fillFilter(
        brandFilter,
        "brand"
      );


      fillFilter(
        coordinateFilter,
        "coordinate"
      );


      fillFilter(
        categoryFilter,
        "category"
      );

    }


    function fillFilter(
      select,
      key
    ) {

      const values = [

        ...new Set(

          cards

            .map(card =>
              card[key]
            )

            .filter(value =>

              value !== undefined &&
              value !== null &&
              String(value).trim() !== ""

            )

            .map(value =>
              String(value).trim()
            )

        )

      ].sort(

        (a, b) =>
          a.localeCompare(
            b,
            "ja"
          )

      );


      values.forEach(value => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          value;


        option.textContent =
          value;


        select.appendChild(
          option
        );

      });

    }


    /* =========================
       表示対象
    ========================= */

    function getVisibleCards() {

      const keyword =
        searchInput.value
          .toLowerCase()
          .trim();


      const type =
        typeFilter.value;


      const brand =
        brandFilter.value;


      const coordinate =
        coordinateFilter.value;


      const category =
        categoryFilter.value;


      return cards.filter(card => {


        /* 通常弾 / プロモ */

        if (
          currentScope === "season" &&
          isPromotion(card)
        ) {

          return false;

        }


        /* 検索 */

        const searchableText = [

          card.id,
          card.name,
          card.unit,
          card.brand,
          card.coordinate,
          card.type,
          card.category,
          card.rarity

        ]

          .filter(value =>
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          )

          .join(" ")

          .toLowerCase();


        if (

          keyword &&
          !searchableText.includes(
            keyword
          )

        ) {

          return false;

        }


        /* タイプ */

        if (

          type &&
          String(
            card.type || ""
          ).trim() !== type

        ) {

          return false;

        }


        /* ブランド */

        if (

          brand &&
          String(
            card.brand || ""
          ).trim() !== brand

        ) {

          return false;

        }


        /* コーデ */

        if (

          coordinate &&
          String(
            card.coordinate || ""
          ).trim() !== coordinate

        ) {

          return false;

        }


        /* カテゴリ */

        if (

          category &&
          String(
            card.category || ""
          ).trim() !== category

        ) {

          return false;

        }


        /* 所持状態 */

        const count =
          getCount(card);


        if (

          currentStatus === "owned" &&
          count < 1

        ) {

          return false;

        }


        if (

          currentStatus === "missing" &&
          count >= 1

        ) {

          return false;

        }


        if (

          currentStatus === "trade" &&
          count < 2

        ) {

          return false;

        }


        return true;

      });

    }


    /* =========================
       全体集計
    ========================= */

    function renderSummary() {

      const scopeCards =
        cards.filter(card => {

          if (
            currentScope === "season"
          ) {

            return !isPromotion(
              card
            );

          }

          return true;

        });


      const owned =
        scopeCards.filter(card =>
          getCount(card) >= 1
        ).length;


      const missing =
        scopeCards.filter(card =>
          getCount(card) === 0
        ).length;


      const trade =
        scopeCards.filter(card =>
          getCount(card) >= 2
        ).length;


      document.getElementById(
        "overallStatus"
      ).textContent =
        `${owned} / ${scopeCards.length}`;


      document.getElementById(
        "ownedCount"
      ).textContent =
        owned;


      document.getElementById(
        "missingCount"
      ).textContent =
        missing;


      document.getElementById(
        "tradeCount"
      ).textContent =
        trade;

    }


    /* =========================
       カード一覧
    ========================= */

    function renderCards() {

      cardList.innerHTML = "";


      const filtered =
        getVisibleCards();


      noResults.style.display =
        filtered.length === 0
          ? "block"
          : "none";


      if (
        filtered.length === 0
      ) {

        return;

      }


      /*
        弾ごとにまとめる
        表示順は第1弾 → 第2弾 → …
        プロモーションは最後
      */

      const normalCards =
        filtered.filter(
          card =>
            !isPromotion(card)
        );


      const promotionCards =
        filtered.filter(
          card =>
            isPromotion(card)
        );


      const seasons = [

        ...new Set(

          normalCards.map(card =>
            String(
              card.season || "1"
            )
          )

        )

      ].sort(

        (a, b) =>
          Number(a) - Number(b)

      );


      seasons.forEach(
        season => {

          const seasonCards =
            normalCards.filter(
              card =>
                String(
                  card.season || "1"
                ) === season
            );


          if (
            seasonCards.length === 0
          ) {

            return;

          }


          createSectionTitle(
            `第${season}弾`
          );


          const grid =
            document.createElement(
              "div"
            );


          grid.className =
            "card-grid";


          seasonCards.forEach(
            card =>
              createCard(
                card,
                grid
              )
          );


          cardList.appendChild(
            grid
          );

        }
      );


      /* プロモ */

      if (
        promotionCards.length > 0
      ) {

        createSectionTitle(
          "♡ プロモーション"
        );


        const grid =
          document.createElement(
            "div"
          );


        grid.className =
          "card-grid";


        promotionCards.forEach(
          card =>
            createCard(
              card,
              grid
            )
        );


        cardList.appendChild(
          grid
        );

      }

    }


    /* =========================
       区切りタイトル
    ========================= */

    function createSectionTitle(
      text
    ) {

      const title =
        document.createElement(
          "h3"
        );


      title.className =
        "collection-section-title";


      title.textContent =
        text;


      cardList.appendChild(
        title
      );

    }


    /* =========================
       カード作成
    ========================= */

    function createCard(
      card,
      grid
    ) {

      const count =
        getCount(card);


      const cardElement =
        document.createElement(
          "article"
        );


      cardElement.className =
        "card";


      cardElement.innerHTML = `

        <div class="card-image">

          <img
            src="${card.image}"
            alt="${card.name || card.id}"
            onerror="this.style.display='none'"
          >

        </div>


        <div class="card-info">

          <div class="card-id">
            ${card.id || ""}
          </div>


          <div class="card-name">
            ${card.name || ""}
          </div>


          <div class="card-meta">
            ${card.brand || ""}
          </div>


          ${
            count >= 2
              ? `<div class="trade-label">
                  ♡ 交換可能
                </div>`
              : ""
          }

        </div>


        <div class="count-control">

          <span class="count">
            所持 ${count}枚
          </span>

        </div>

      `;


      cardElement.addEventListener(
        "click",
        () => {

          if (
            isPromotion(card)
          ) {

            location.href =
              "promotion.html";

          } else {

            location.href =
              `cards.html?season=${card.season || 1}`;

          }

        }
      );


      grid.appendChild(
        cardElement
      );

    }


    /* =========================
       全体更新
    ========================= */

    function renderAll() {

      renderSummary();

      renderCards();

    }


    /* =========================
       スコープ切り替え
    ========================= */

    document
      .querySelectorAll(
        ".scope-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".scope-button"
              )
              .forEach(button =>
                button.classList.remove(
                  "active"
                )
              );


            button.classList.add(
              "active"
            );


            currentScope =
              button.dataset.scope;


            renderAll();

          }
        );

      });


    /* =========================
       検索
    ========================= */

    searchInput.addEventListener(
      "input",
      renderCards
    );


    /* =========================
       フィルター
    ========================= */

    [

      typeFilter,
      brandFilter,
      coordinateFilter,
      categoryFilter

    ].forEach(select => {

      select.addEventListener(
        "change",
        renderCards
      );

    });


    /* =========================
       所持状態
    ========================= */

    document
      .querySelectorAll(
        ".status-button"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".status-button"
              )
              .forEach(button =>
                button.classList.remove(
                  "active"
                )
              );


            button.classList.add(
              "active"
            );


            currentStatus =
              button.dataset.status;


            renderCards();

          }
        );

      });


    /* =========================
       戻ってきたとき更新
    ========================= */

    window.addEventListener(
      "pageshow",
      () => {

        if (
          cards.length > 0
        ) {

          loadOwnership();

          renderAll();

        }

      }
    );

  </script>

</body>
</html>
